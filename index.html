<script>
  // Safety net: if the app hasn't rendered into #root within a few seconds
  // (e.g. a CDN script failed to load, likely due to no internet connection),
  // show a clear message instead of leaving the page blank. Capture phase
  // (the `true` below) is required to catch script/resource load failures,
  // not just runtime errors inside scripts that already ran.
  window.__appErrors = [];
  window.addEventListener('error', function (e) {
    var detail = e.message;
    if (!detail && e.target && e.target.src) detail = 'Failed to load: ' + e.target.src;
    if (!detail && e.target && e.target.tagName) detail = 'Failed to load a ' + e.target.tagName + ' resource';
    window.__appErrors.push(detail || 'Unknown error');
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    window.__appErrors.push('Unhandled promise rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  setTimeout(function () {
    var root = document.getElementById('root');
    var stillPlaceholder = root && root.querySelector('#fallback-msg');
    if (stillPlaceholder) {
      var errs = window.__appErrors.length
        ? '<br><br>Details:<br>' + window.__appErrors.join('<br>')
        : '<br><br>No specific error was captured — this usually means a script is still loading slowly, or the network blocked it silently.';
      stillPlaceholder.innerHTML =
        'Could not load the app. This usually means one of the required scripts failed to load — ' +
        'please check your internet connection and refresh the page.' + errs;
    }
  }, 8000);
</script>

const { useState, useEffect, useMemo, useRef } = React;

// ---------------------------------------------------------------------------
// localStorage-backed storage shim, matching the window.storage API shape
// used by usePersistentState below (get/set only — this app doesn't need
// delete/list). Swap this out if you later add a real backend.
// ---------------------------------------------------------------------------
const storage = {
  get: async (key) => {
    const v = window.localStorage.getItem(key);
    if (v === null) throw new Error("not found");
    return { key, value: v };
  },
  set: async (key, value) => {
    window.localStorage.setItem(key, value);
    return { key, value };
  },
};

// ---------------------------------------------------------------------------
// Supabase — free-tier project storing only Student name, academic year,
// class, section, plus a present/absent record per student per date.
// ---------------------------------------------------------------------------
const SUPABASE_URL = "https://iwoevbqfumnkgvgroxgn.supabase.co";
const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3b2V2YnFmdW1ua2d2Z3JveGduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNTgzMjYsImV4cCI6MjEwMTgzNDMyNn0.ZQbb74jeEdvp31OiJ6dFCRIRIuc9n4b3nvHYv1gbGTE";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Students live in Supabase now. Field names on the returned objects (_id,
// _name, _class, _section, _year) match what the rest of the app already
// expects, so only the fetch/import logic below needed to change.
function useSupabaseStudents() {
  const [students, setStudents] = useState([]);
  const [ready, setReady] = useState(false);
  const [error, setError] = useState(null);

  const refresh = async () => {
    const { data, error: err } = await supabaseClient
      .from("students")
      .select("*")
      .order("name", { ascending: true });
    if (err) {
      setError(err.message);
    } else {
      setError(null);
      setStudents(
        (data || []).map((r) => ({
          _id: r.id,
          _name: r.name || "",
          _class: r.class || "",
          _section: r.section || "",
          _year: r.academic_year || "Unspecified",
          _gender: r.gender || "",
        }))
      );
    }
    setReady(true);
  };

  useEffect(() => {
    refresh();
  }, []);

  // Imports students without ever discarding attendance history:
  //  - Matches incoming rows to existing students by (year, class, section,
  //    name), and UPDATEs them in place — the row's id (and therefore every
  //    attendance record tied to it) is preserved.
  //  - New names in the sheet are INSERTed.
  //  - Only removes existing students who (a) are in the same class/section
  //    as the sheet being imported, AND (b) are missing from that sheet — so
  //    importing one section's list can never touch another section's roster
  //    or attendance. If a removed student still has attendance history, the
  //    delete is blocked by the database (ON DELETE RESTRICT) and that
  //    student is left in place rather than losing their history.
  const importRows = async (rows) => {
    const groups = new Map();
    rows.forEach((r) => {
      const key = `${r._year}||${r._class}||${r._section}`;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(r);
    });

    const skippedNames = [];

    for (const [key, groupRows] of groups) {
      const [gYear, gClass, gSection] = key.split("||");

      const { data: existing, error: fetchErr } = await supabaseClient
        .from("students")
        .select("id, name")
        .eq("academic_year", gYear)
        .eq("class", gClass)
        .eq("section", gSection);
      if (fetchErr) {
        setError(fetchErr.message);
        throw fetchErr;
      }

      const existingByName = new Map((existing || []).map((s) => [s.name.trim().toLowerCase(), s]));
      const matchedIds = new Set();

      for (const r of groupRows) {
        const nameKey = (r._name || "").trim().toLowerCase();
        const match = existingByName.get(nameKey);
        if (match) {
          matchedIds.add(match.id);
          const { error: updErr } = await supabaseClient
            .from("students")
            .update({ name: r._name, class: r._class, section: r._section, academic_year: r._year, gender: r._gender || null })
            .eq("id", match.id);
          if (updErr) {
            setError(updErr.message);
            throw updErr;
          }
        } else {
          const { error: insErr } = await supabaseClient.from("students").insert({
            name: r._name,
            academic_year: r._year,
            class: r._class,
            section: r._section,
            gender: r._gender || null,
          });
          if (insErr) {
            setError(insErr.message);
            throw insErr;
          }
        }
      }

      for (const ex of existing || []) {
        if (matchedIds.has(ex.id)) continue;
        const { error: delErr } = await supabaseClient.from("students").delete().eq("id", ex.id);
        if (delErr) skippedNames.push(ex.name); // has attendance history — kept, not deleted
      }
    }

    await refresh();
    return skippedNames;
  };

  return { students, ready, error, importRows, refresh };
}

// Attendance also lives in Supabase, one row per student per date. The
// in-memory shape ({ [date]: { [studentId]: "present"|"absent" } }) matches
// what the rest of the app already expects, so only marking/loading changed.
function useSupabaseAttendance() {
  const [attendance, setAttendance] = useState({});
  const [ready, setReady] = useState(false);
  const [error, setError] = useState(null);

  const refresh = async () => {
    const { data, error: err } = await supabaseClient
      .from("attendance")
      .select("student_id, date, status");
    if (err) {
      setError(err.message);
    } else {
      setError(null);
      const next = {};
      (data || []).forEach((r) => {
        const day = next[r.date] || (next[r.date] = {});
        day[r.student_id] = r.status;
      });
      setAttendance(next);
    }
    setReady(true);
  };

  useEffect(() => {
    refresh();
  }, []);

  // Called on every Present/Absent button click. Updates local state right
  // away, then syncs to Supabase in the background.
  const mark = async (studentId, date, status) => {
    setAttendance((prev) => {
      const day = { ...(prev[date] || {}) };
      if (status === null) delete day[studentId];
      else day[studentId] = status;
      return { ...prev, [date]: day };
    });
    try {
      if (status === null) {
        await supabaseClient.from("attendance").delete().eq("student_id", studentId).eq("date", date);
      } else {
        await supabaseClient
          .from("attendance")
          .upsert({ student_id: studentId, date, status }, { onConflict: "student_id,date" });
      }
      setError(null);
    } catch (e) {
      setError("Could not sync attendance to the database.");
    }
  };

  // Mark many students at once (e.g. "mark all present") in a single
  // network round trip instead of one request per student.
  const markBulk = async (studentIds, date, status) => {
    if (!studentIds.length) return;
    setAttendance((prev) => {
      const day = { ...(prev[date] || {}) };
      studentIds.forEach((id) => {
        day[id] = status;
      });
      return { ...prev, [date]: day };
    });
    try {
      const rows = studentIds.map((student_id) => ({ student_id, date, status }));
      await supabaseClient.from("attendance").upsert(rows, { onConflict: "student_id,date" });
      setError(null);
    } catch (e) {
      setError("Could not sync attendance to the database.");
    }
  };

  return { attendance, ready, error, mark, markBulk };
}

// ---------------------------------------------------------------------------
// Voice typing — thin wrapper around the browser's SpeechRecognition API.
// Not supported in every browser (notably desktop Safari/Firefox), so
// MicButton simply doesn't render when it's unavailable.
// ---------------------------------------------------------------------------
function useSpeechRecognition() {
  const SR = typeof window !== "undefined" ? window.SpeechRecognition || window.webkitSpeechRecognition : null;
  const [listening, setListening] = useState(false);
  const recRef = useRef(null);

  const start = (lang, onResult) => {
    if (!SR) return;
    try {
      recRef.current?.stop();
    } catch (e) {}
    const rec = new SR();
    rec.lang = lang;
    rec.interimResults = true;
    rec.continuous = false;
    rec.onresult = (e) => {
      let transcript = "";
      for (let i = 0; i < e.results.length; i++) transcript += e.results[i][0].transcript;
      onResult(transcript);
    };
    rec.onerror = () => setListening(false);
    rec.onend = () => setListening(false);
    recRef.current = rec;
    setListening(true);
    rec.start();
  };

  const stop = () => {
    try {
      recRef.current?.stop();
    } catch (e) {}
    setListening(false);
  };

  return { supported: !!SR, listening, start, stop };
}

function MicButton({ lang, onResult, size = 15 }) {
  const { supported, listening, start, stop } = useSpeechRecognition();
  if (!supported) return null;
  return (
    <button
      type="button"
      onClick={() => (listening ? stop() : start(lang, onResult))}
      className="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0"
      style={{
        background: listening ? THEME.coral : THEME.chalk,
        border: `1px solid ${listening ? THEME.coral : THEME.line}`,
      }}
      aria-label={listening ? "Stop voice typing" : "Voice typing"}
      title={listening ? "Listening… tap to stop" : "Voice typing"}
    >
      <Icon glyph="mic" size={size} style={{ color: listening ? "#fff" : THEME.inkSoft }} />
    </button>
  );
}

function SchoolLogo({ size = 40 }) {
  return (
    <div
      className="rounded-full flex items-center justify-center flex-shrink-0"
      style={{ width: size, height: size, background: "#FFFFFF", boxShadow: "0 1px 3px rgba(0,0,0,0.15)" }}
    >
      <img
        src={LOGO_DATA_URI}
        alt="Reena's Tracking App"
        style={{ width: size * 0.8, height: size * 0.8, objectFit: "contain" }}
      />
    </div>
  );
}

// ---------------------------------------------------------------------------
// Persistent storage hook — reads/writes the artifact key-value store.
// ---------------------------------------------------------------------------
function usePersistentState(key, initialValue) {
  const [value, setValue] = useState(initialValue);
  const [ready, setReady] = useState(false);
  const [error, setError] = useState(null);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const result = await storage.get(key);
        if (!cancelled && result && result.value) {
          setValue(JSON.parse(result.value));
        }
      } catch (e) {
        // key not found yet — keep initial value
      } finally {
        if (!cancelled) setReady(true);
      }
    })();
    return () => {
      cancelled = true;
    };
  }, [key]);

  const persist = async (next) => {
    const resolved = typeof next === "function" ? next(value) : next;
    setValue(resolved);
    try {
      const result = await storage.set(key, JSON.stringify(resolved));
      if (!result) setError("Could not save. Your changes may not persist.");
      else setError(null);
    } catch (e) {
      setError("Could not save. Your changes may not persist.");
    }
  };

  return [value, persist, ready, error];
}

  const [examName, setExamName] = useState("");
  const [examClass, setExamClass] = useState("11th");
  const [examDate, setExamDate] = useState("");
  const examSectionRef = useRef(null);
  const [showDictionary, setShowDictionary] = useState(false);
  const [showTranslator, setShowTranslator] = useState(false);

  const totalStudents = students.length;

    TODAY_INDEX === -1

      : PERIODS.filter((p) => (timetable[`${TODAY_INDEX}-${p}`] || "").trim() !== "").length;

      {showTranslator && <TranslatorSheet onClose={() => setShowTranslator(false)} />}
    </div>
  );
}

// ---------------------------------------------------------------------------
// Today's Attendance card — pick a class + section, see present/absent counts
// and the absentee list for today, with a one-tap "copy for WhatsApp" summary.
// ---------------------------------------------------------------------------
// Sorts absentee lists into a stable gender order (boys, then girls, then
// anything unlabeled/other) so the WhatsApp summary reads consistently.
function genderRank(g) {
  const v = (g || "").trim().toLowerCase();
  if (["m", "male", "boy", "boys"].includes(v)) return 0;
  if (["f", "female", "girl", "girls"].includes(v)) return 1;
  if (!v) return 2;
  return 3;
}

function AttendanceSummaryCard({ students, attendance, ready, setTab }) {
  const [className, setClassName] = useState("");
  const [section, setSection] = useState("");
  const [copied, setCopied] = useState(false);

  const todayStr = new Date().toISOString().slice(0, 10);
  const [selectedDate, setSelectedDate] = useState(todayStr);
  const isToday = selectedDate === todayStr;
  const dayAttendance = attendance[selectedDate] || {};
  const selectedDateLabel = new Date(selectedDate + "T00:00:00").toLocaleDateString(undefined, {
    weekday: "short",
    year: "numeric",
    month: "short",
    day: "numeric",
  });

  const classes = useMemo(
    () => [...new Set(students.map((s) => s._class).filter(Boolean))].sort(),
    [students]
  );
  const sections = useMemo(
    () =>
      [...new Set(
        students.filter((s) => !className || s._class === className).map((s) => s._section).filter(Boolean)
      )].sort(),
    [students, className]
  );

  // Default to the first available class, but leave section as "" (All) —
  // that's now the default view for the WhatsApp summary.
  useEffect(() => {
    if (!ready) return;
    if (!className && classes.length) setClassName(classes[0]);
  }, [ready, classes, className]);

  const scoped = useMemo(
    () =>
      students.filter(
        (s) => (!className || s._class === className) && (!section || s._section === section)
      ),
    [students, className, section]
  );

  // Everyone not explicitly marked absent counts as present by default.
  const presentList = scoped.filter((s) => dayAttendance[s._id] !== "absent");
  const absentList = scoped
    .filter((s) => dayAttendance[s._id] === "absent")
    .sort((a, b) => genderRank(a._gender) - genderRank(b._gender) || a._name.localeCompare(b._name));
  const classLabel = className
    ? `${className}${section ? ` '${section}'` : sections.length > 1 ? " (All Sections)" : ""}`
    : "—";

  // Students in this class/section absent on more than 2 days in the
  // selected date's calendar month — flagged so it's easy to spot patterns.
  const monthPrefix = selectedDate.slice(0, 7); // "YYYY-MM"
  const monthLabel = new Date(selectedDate + "T00:00:00").toLocaleDateString(undefined, {
    month: "long",
    year: "numeric",
  });
  const monthlyAbsenceCounts = useMemo(() => {
    const counts = {};
    Object.keys(attendance).forEach((date) => {
      if (!date.startsWith(monthPrefix)) return;
      const day = attendance[date];
      scoped.forEach((s) => {
        if (day[s._id] === "absent") counts[s._id] = (counts[s._id] || 0) + 1;
      });
    });
    return counts;
  }, [attendance, scoped, monthPrefix]);
  const frequentAbsentees = scoped
    .filter((s) => (monthlyAbsenceCounts[s._id] || 0) > 2)
    .sort((a, b) => (monthlyAbsenceCounts[b._id] || 0) - (monthlyAbsenceCounts[a._id] || 0));

  const buildShareText = () => {
    const lines = [
      `📋 ${isToday ? "Today's" : selectedDateLabel} Attendance – ${classLabel}`,
      `📅 ${selectedDateLabel}`,
      "",
      `Present: ${presentList.length}`,
      `Absent: ${absentList.length}`,
    ];
    if (absentList.length) {
      lines.push("", "Absentees:");
      absentList.forEach((s, i) => lines.push(`${i + 1}. ${s._name}`));
    }
    if (frequentAbsentees.length) {
      lines.push("", `⚠️ Leave taken > 2 days in ${monthLabel}:`);
      frequentAbsentees.forEach((s, i) => lines.push(`${i + 1}. ${s._name} (${monthlyAbsenceCounts[s._id]} days)`));
    }
    return lines.join("\n");
  };

  const copySummary = async () => {
    const text = buildShareText();
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      // Fallback for browsers/contexts without clipboard API access.
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand("copy"); } catch (err) {}
      document.body.removeChild(ta);
    }
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  const canShare = typeof navigator !== "undefined" && !!navigator.share;
  const shareSummary = async () => {
    const text = buildShareText();
    try {
      await navigator.share({ title: `Attendance – ${classLabel}`, text });
    } catch (e) {
      // User cancelled the share sheet, or share isn't supported here —
      // nothing to do either way.
    }
  };

// ---------------------------------------------------------------------------
// Dictionary & Translator — Sheet-based, English/Tamil/Hindi + botany glossary
// ---------------------------------------------------------------------------
const LANGUAGES = [
  { code: "en", label: "English" },
  { code: "ta", label: "Tamil" },
  { code: "hi", label: "Hindi" },
];

// Locale codes for the SpeechRecognition API (BCP-47), keyed by our short
// translator/dictionary language codes.
const SPEECH_LOCALES = { en: "en-IN", ta: "ta-IN", hi: "hi-IN" };


// ---------------------------------------------------------------------------
// Translator — English / Tamil / Hindi, slide-up sheet
// ---------------------------------------------------------------------------
function TranslatorSheet({ onClose }) {
  const [from, setFrom] = useState("en");
  const [to, setTo] = useState("ta");
  const [text, setText] = useState("");
  const [result, setResult] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [copied, setCopied] = useState(false);

  const swapLangs = () => {
    setFrom(to);
    setTo(from);
    setText(result);
    setResult("");
  };

  const translate = async () => {
    const q = text.trim();
    if (!q || from === to) return;
    setLoading(true);
    setError("");
    setResult("");
    setCopied(false);
    try {
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=${from}|${to}`);
      if (!res.ok) throw new Error(`Request failed (${res.status})`);
      const data = await res.json();
      const translated = data?.responseData?.translatedText;
      if (!translated) throw new Error("No translation returned");
      setResult(translated);
    } catch (e) {
      console.error("Translation failed:", e);
      setError("Couldn't translate that — check your internet connection and try again.");
    } finally {
      setLoading(false);
    }
  };

  const copyResult = async () => {
    try {
      await navigator.clipboard.writeText(result);
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = result;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand("copy"); } catch (err) {}
      document.body.removeChild(ta);
    }
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  return (
    <Sheet onClose={onClose} title="Translator">
      <div className="flex items-center gap-2 mb-4">
        <div className="flex-1 grid grid-cols-1 gap-1.5">
          {LANGUAGES.map((l) => (
            <button
              key={l.code}
              onClick={() => setFrom(l.code)}
              className="text-xs font-bold px-3 py-2 rounded-2xl border-2 text-left"
              style={
                from === l.code
                  ? { background: THEME.greenSoft, color: THEME.greenDark, borderColor: THEME.green }
                  : { background: "#fff", color: THEME.ink, borderColor: THEME.line }
              }
            >
              {l.label}
            </button>
          ))}
        </div>
        <button
          onClick={swapLangs}
          className="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0"
          style={{ background: THEME.chalk, border: `1px solid ${THEME.line}` }}
          aria-label="Swap languages"
        >
          <Icon glyph="swap" size={16} style={{ color: THEME.greenDark }} />
        </button>
        <div className="flex-1 grid grid-cols-1 gap-1.5">
          {LANGUAGES.map((l) => (
            <button
              key={l.code}
              onClick={() => setTo(l.code)}
              className="text-xs font-bold px-3 py-2 rounded-2xl border-2 text-left"
              style={
                to === l.code
                  ? { background: THEME.marigoldSoft, color: "#8A6300", borderColor: THEME.marigold }
                  : { background: "#fff", color: THEME.ink, borderColor: THEME.line }
              }
            >
              {l.label}
            </button>
          ))}
        </div>
      </div>

      <div className="flex items-start gap-2 mb-3">
        <textarea
          value={text}
          onChange={(e) => setText(e.target.value)}
          rows={3}
          placeholder="Type text to translate…"
          className="flex-1 rounded-xl p-3 text-sm outline-none"
          style={{ border: `2px solid ${THEME.line}` }}
        />
        <MicButton
          lang={SPEECH_LOCALES[from] || "en-IN"}
          onResult={(t) => setText(t)}
        />
      </div>

      <button
        onClick={translate}
        disabled={!text.trim() || loading || from === to}
        className="w-full py-3 rounded-full text-white font-semibold disabled:opacity-40 mb-2"
        style={{ background: THEME.gradient, fontFamily: "'Poppins', sans-serif" }}
      >
        {loading ? "Translating…" : "Translate"}
      </button>
      {from === to && <p className="text-xs mb-3" style={{ color: THEME.coral }}>Pick two different languages.</p>}
      {error && <p className="text-sm text-center py-2" style={{ color: THEME.coral }}>{error}</p>}
      {result && (
        <div className="rounded-xl p-3" style={{ background: THEME.greenSoft }}>
          <div className="flex items-start justify-between gap-2">
            <p className="text-sm flex-1" style={{ color: THEME.ink }}>{result}</p>
            <button
              onClick={copyResult}
              className="flex items-center gap-1 text-xs font-semibold px-2.5 py-1.5 rounded-full flex-shrink-0"
              style={{ background: copied ? THEME.green : "#fff", color: copied ? "#fff" : THEME.greenDark, border: `1px solid ${THEME.green}` }}
              aria-label="Copy translation"
            >
              <Icon glyph="clipboard" size={13} />
              {copied ? "Copied!" : "Copy"}
            </button>
          </div>
        </div>
      )}
      <p className="text-xs mt-3" style={{ color: THEME.inkSoft }}>
        Machine translation can be imperfect, especially for longer sentences.
      </p>
    </Sheet>
  );
}

// ---------------------------------------------------------------------------
// Tamil Calendar — today's Tamil solar month/day + weekday, computed locally
// (no internet needed). The Tamil calendar is solar, so month-start dates are
// stable year to year (±1 day). Thithi/nakshatram require lunar ephemeris
// data we don't have, so we link out to Nithra's Tamil Calendar for the full
// panchangam instead of guessing at astrological details.
// ---------------------------------------------------------------------------
const TAMIL_MONTHS = [
  { name: "Chithirai", startMonth: 4, startDay: 14 },
  { name: "Vaikasi", startMonth: 5, startDay: 15 },
  { name: "Aani", startMonth: 6, startDay: 15 },
  { name: "Aadi", startMonth: 7, startDay: 17 },
  { name: "Aavani", startMonth: 8, startDay: 17 },
  { name: "Purattasi", startMonth: 9, startDay: 17 },
  { name: "Aippasi", startMonth: 10, startDay: 18 },
  { name: "Karthigai", startMonth: 11, startDay: 17 },
  { name: "Margazhi", startMonth: 12, startDay: 16 },
  { name: "Thai", startMonth: 1, startDay: 14 },
  { name: "Maasi", startMonth: 2, startDay: 13 },
  { name: "Panguni", startMonth: 3, startDay: 14 },
];

const TAMIL_WEEKDAYS = [
  "Gnayiru (Sunday)",
  "Thingal (Monday)",
  "Sevvai (Tuesday)",
  "Budhan (Wednesday)",
  "Viyazhan (Thursday)",
  "Velli (Friday)",
  "Sani (Saturday)",
];

function getTamilDate(d) {
  const y = d.getFullYear();
  const starts = TAMIL_MONTHS.map((m) => {
    // Thai..Panguni (indexes 9-11) start in the following calendar year
    // relative to Chithirai..Margazhi (indexes 0-8) of the same y.
    const year = m.startMonth <= 3 ? y : y;
    return { ...m, date: new Date(year, m.startMonth - 1, m.startDay) };
  });
  // Build a full ordered list spanning from last Chithirai to next Chithirai
  // so we can find which window today falls into, regardless of where in
  // the Gregorian year we are.
  const candidates = [];
  for (const offsetYear of [-1, 0, 1]) {
    for (const m of TAMIL_MONTHS) {
      const yr = m.startMonth <= 3 ? y + offsetYear + 1 : y + offsetYear;
      candidates.push({ name: m.name, date: new Date(yr, m.startMonth - 1, m.startDay) });
    }
  }
  candidates.sort((a, b) => a.date - b.date);
  let current = candidates[0];
  for (const c of candidates) {
    if (c.date <= d) current = c;
    else break;
  }
  const dayNum = Math.floor((d - current.date) / (1000 * 60 * 60 * 24)) + 1;
  return { month: current.name, day: dayNum };
}

// ---------------------------------------------------------------------------
// Panchangam math — Sun/Moon ecliptic longitude via standard low-precision
// formulas (Meeus, "Astronomical Algorithms"), Lahiri ayanamsa, and a
// standard NOAA-style sunrise/sunset calculation. Coordinates default to
// Chennai / Tamil Nadu. All computed locally, no internet needed.
// ---------------------------------------------------------------------------
const DEG = Math.PI / 180;
const normDeg = (x) => ((x % 360) + 360) % 360;

function toJulianDay(date) {
  const y = date.getUTCFullYear();
  let m = date.getUTCMonth() + 1;
  let yy = y;
  if (m <= 2) { yy -= 1; m += 12; }
  const A = Math.floor(yy / 100);
  const B = 2 - A + Math.floor(A / 4);
  const dayFrac = date.getUTCDate() + (date.getUTCHours() + date.getUTCMinutes() / 60 + date.getUTCSeconds() / 3600) / 24;
  return Math.floor(365.25 * (yy + 4716)) + Math.floor(30.6001 * (m + 1)) + dayFrac + B - 1524.5;
}

function sunLongitudeDeg(jd) {
  const T = (jd - 2451545.0) / 36525;
  const L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
  const M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
  const Mr = M * DEG;
  const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(Mr)
    + (0.019993 - 0.000101 * T) * Math.sin(2 * Mr)
    + 0.000289 * Math.sin(3 * Mr);
  return normDeg(L0 + C);
}

function moonLongitudeDeg(jd) {
  const T = (jd - 2451545.0) / 36525;
  const Lp = 218.3164477 + 481267.88123421 * T - 0.0015786 * T * T;
  const D = (297.8501921 + 445267.1114034 * T - 0.0018819 * T * T) * DEG;
  const M = (357.5291092 + 35999.0502909 * T - 0.0001536 * T * T) * DEG;
  const Mp = (134.9633964 + 477198.8675055 * T + 0.0087414 * T * T) * DEG;
  const F = (93.2720950 + 483202.0175233 * T - 0.0036539 * T * T) * DEG;
  const dL =
    6.288774 * Math.sin(Mp) + 1.274027 * Math.sin(2 * D - Mp) + 0.658314 * Math.sin(2 * D)
    + 0.213618 * Math.sin(2 * Mp) - 0.185116 * Math.sin(M) - 0.114332 * Math.sin(2 * F)
    + 0.058793 * Math.sin(2 * D - 2 * Mp) + 0.057066 * Math.sin(2 * D - M - Mp)
    + 0.053322 * Math.sin(2 * D + Mp) + 0.045758 * Math.sin(2 * D - M)
    - 0.040923 * Math.sin(M - Mp) - 0.034720 * Math.sin(D) - 0.030383 * Math.sin(M + Mp);
  return normDeg(Lp + dL);
}

function lahiriAyanamsaDeg(jd) {
  const yearsSince2000 = (jd - 2451545.0) / 365.25;
  return 23.85 + 0.013972 * yearsSince2000;
}

// Standard sunrise/sunset algorithm (Sun eq. from Almanac, NOAA-equivalent).
function sunriseSunset(date, lat, lon) {
  const rad = DEG;
  const start = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
  const dayOfYear = Math.floor((start - Date.UTC(date.getFullYear(), 0, 0)) / 86400000);
  const lngHour = lon / 15;

  const calc = (isRise) => {
    const t = dayOfYear + ((isRise ? 6 : 18) - lngHour) / 24;
    const M = 0.9856 * t - 3.289;
    let L = M + 1.916 * Math.sin(M * rad) + 0.020 * Math.sin(2 * M * rad) + 282.634;
    L = normDeg(L);
    let RA = Math.atan(0.91764 * Math.tan(L * rad)) / rad;
    RA = normDeg(RA);
    RA += Math.floor(L / 90) * 90 - Math.floor(RA / 90) * 90;
    RA /= 15;
    const sinDec = 0.39782 * Math.sin(L * rad);
    const cosDec = Math.cos(Math.asin(sinDec));
    const cosH = (Math.cos(90.833 * rad) - sinDec * Math.sin(lat * rad)) / (cosDec * Math.cos(lat * rad));
    if (cosH > 1 || cosH < -1) return null;
    let H = isRise ? 360 - Math.acos(cosH) / rad : Math.acos(cosH) / rad;
    H /= 15;
    const T = H + RA - 0.06571 * t - 6.622;
    return ((T - lngHour) % 24 + 24) % 24; // UTC decimal hours
  };

  const riseUT = calc(true);
  const setUT = calc(false);
  const toDate = (ut) => (ut == null ? null : new Date(start + ut * 3600000));
  return { sunrise: toDate(riseUT), sunset: toDate(setUT) };
}

const fmtTime = (d) => (d ? d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }) : "—");

const THITHI_NAMES = [
  "Prathamai", "Dvitiyai", "Tritiyai", "Chaturthi", "Panchami", "Sashti", "Sapthami",
  "Ashtami", "Navami", "Dashami", "Ekadashi", "Dvadashi", "Trayodashi", "Chaturdashi",
];
const NAKSHATRA_NAMES_TA = [
  "Ashwini", "Bharani", "Krithigai", "Rohini", "Mrigasirisham", "Thiruvathirai", "Punarpoosam",
  "Poosam", "Ayilyam", "Magam", "Pooram", "Uthiram", "Hastham", "Chithirai", "Swathi",
  "Visakam", "Anusham", "Kettai", "Moolam", "Pooradam", "Uthiradam", "Thiruvonam",
  "Avittam", "Sathayam", "Poorattathi", "Uthirattathi", "Revathi",
];
const RASI_NAMES_TA = [
  "Mesham", "Rishabam", "Mithunam", "Kadagam", "Simmam", "Kanni",
  "Thulam", "Vrichigam", "Dhanusu", "Magaram", "Kumbam", "Meenam",
];

// Default reference location: Chennai / Tamil Nadu.
const DEFAULT_LAT = 13.0827;
const DEFAULT_LON = 80.2707;

function computePanchangam(date) {
  const jd = toJulianDay(date);
  const sunLon = sunLongitudeDeg(jd);
  const moonLon = moonLongitudeDeg(jd);
  const ayanamsa = lahiriAyanamsaDeg(jd);

  const elongation = normDeg(moonLon - sunLon);
  const thithiIndex = Math.floor(elongation / 12); // 0-29
  const paksha = thithiIndex < 15 ? "Shukla Paksham (waxing)" : "Krishna Paksham (waning)";
  const inPaksha = thithiIndex % 15;
  const thithi = inPaksha === 14
    ? (thithiIndex < 15 ? "Pournami (Full Moon)" : "Amavasai (New Moon)")
    : THITHI_NAMES[inPaksha];

  const siderealMoon = normDeg(moonLon - ayanamsa);
  const nakshatraIndex = Math.floor(siderealMoon / (360 / 27));
  const rasiIndex = Math.floor(siderealMoon / 30);

  const { sunrise, sunset } = sunriseSunset(date, DEFAULT_LAT, DEFAULT_LON);
  let rahuKalam = "—", yamagandam = "—", gulikaKalam = "—";
  if (sunrise && sunset) {
    const segment = (sunset - sunrise) / 8;
    const segTime = (n) => {
      const s = new Date(sunrise.getTime() + (n - 1) * segment);
      const e = new Date(sunrise.getTime() + n * segment);
      return `${fmtTime(s)} – ${fmtTime(e)}`;
    };
    const dow = date.getDay(); // 0=Sun..6=Sat
    const RAHU_OCTANT = [8, 2, 7, 5, 6, 4, 3];
    const YAMA_OCTANT = [5, 4, 3, 2, 1, 7, 6];
    const GULIKA_OCTANT = [7, 6, 5, 4, 3, 2, 1];
    rahuKalam = segTime(RAHU_OCTANT[dow]);
    yamagandam = segTime(YAMA_OCTANT[dow]);
    gulikaKalam = segTime(GULIKA_OCTANT[dow]);
  }

  return {
    thithi,
    paksha,
    nakshatra: NAKSHATRA_NAMES_TA[nakshatraIndex] || "—",
    rasi: RASI_NAMES_TA[rasiIndex] || "—",
    sunrise: fmtTime(sunrise),
    sunset: fmtTime(sunset),
    rahuKalam,
    yamagandam,
    gulikaKalam,
  };
}

// Dictionary — English word lookups, slide-up sheet
// Biology/botany terms check the local glossary first (works offline, and
// includes Tamil/Hindi); anything not found there falls back to the live
// English dictionary API, so results are never thin.
// ---------------------------------------------------------------------------
function DictionarySheet({ onClose }) {
  const [word, setWord] = useState("");
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const fetchGeneral = async (q) => {
    const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(q)}`);
    if (res.status === 404) return null;
    if (!res.ok) throw new Error(`Request failed (${res.status})`);
    const data = await res.json();
    const entry = data[0];
    const meanings = (entry?.meanings || []).slice(0, 4).map((m) => ({
      partOfSpeech: m.partOfSpeech,
      definitions: (m.definitions || []).slice(0, 3).map((d) => d.definition),
    }));
    return { word: entry?.word || q, phonetic: entry?.phonetic, meanings };
  };

  const lookup = async () => {
    const q = word.trim();
    if (!q) return;
    setLoading(true);
    setError("");
    setResult(null);
    try {
      const general = await fetchGeneral(q);
      if (general) setResult(general);
      else setError(`No definition found for "${q}". Check the spelling and try again.`);
    } catch (e) {
      console.error("Dictionary lookup failed:", e);
      setError("Couldn't look that up — check your internet connection and try again.");
    } finally {
      setLoading(false);
    }
  };

  return (
    <Sheet onClose={onClose} title="Dictionary">
      <p className="text-xs mb-3" style={{ color: THEME.inkSoft }}>
        Search any English word for its meaning.
      </p>
      <div className="flex gap-2 mb-4">
        <input
          value={word}
          onChange={(e) => setWord(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && lookup()}
          placeholder="e.g. photosynthesis"
          className="flex-1 rounded-xl p-3 text-sm outline-none"
          style={{ border: `2px solid ${THEME.line}` }}
        />
        <MicButton lang="en-IN" onResult={(t) => setWord(t)} />
        <button
          onClick={lookup}
          disabled={!word.trim() || loading}
          className="w-12 h-12 rounded-xl text-white flex items-center justify-center flex-shrink-0 disabled:opacity-40"
          style={{ background: THEME.green }}
        >
          <Icon glyph="search" size={18} />
        </button>
      </div>

      {loading && <p className="text-sm text-center py-6" style={{ color: THEME.inkSoft }}>Looking it up…</p>}
      {error && <p className="text-sm text-center py-4" style={{ color: THEME.coral }}>{error}</p>}

      {!loading && !error && !result && (
        <div className="text-center py-6">
          <Icon glyph="book" size={26} style={{ color: THEME.greenDark }} />
          <p className="text-sm mt-2" style={{ color: THEME.inkSoft }}>
            Search any word to see its meaning.
          </p>
        </div>
      )}

      {result && (
        <div style={{ maxHeight: "55vh", overflowY: "auto" }}>
          <div className="flex items-baseline gap-2 mb-2">
            <p className="text-lg font-semibold" style={{ fontFamily: "'Poppins', sans-serif", color: THEME.ink }}>{result.word}</p>
            {result.phonetic && <p className="text-sm" style={{ color: THEME.inkSoft }}>{result.phonetic}</p>}
          </div>
          {result.meanings.map((m, mi) => (
            <div key={mi} className="mb-3">
              <span className="text-xs font-bold px-2 py-1 rounded-full" style={{ background: THEME.greenSoft, color: THEME.greenDark }}>
                {m.partOfSpeech}
              </span>
              <ul className="mt-2 space-y-1.5">
                {m.definitions.map((d, di) => (
                  <li key={di} className="text-sm" style={{ color: THEME.ink }}>
                    <span style={{ color: THEME.inkSoft }}>{di + 1}.</span> {d}
                  </li>
                ))}
              </ul>
            </div>
          ))}
        </div>
      )}
    </Sheet>
  );
}

const SENSITIVE_HINT_KEYWORDS = ["aadhaar", "phone", "email", "address", "religion", "father", "mother"];

function detectAcademicYear(fileName) {
  const m = String(fileName || "").match(/(20\d{2})\s*[-_/]\s*(\d{2,4})/);
  if (!m) return "";
  let end = m[2];
  if (end.length === 4) end = end.slice(2);
  return `${m[1]}-${end}`;
}

function findHeaderKey(headers, exactList, substrList = [], excludeList = []) {
  const norm = (h) => h.trim().toLowerCase();
  for (const h of headers) {
    if (exactList.includes(norm(h))) return h;
  }
  for (const h of headers) {
    const hh = norm(h);
    if (excludeList.some((ex) => hh.includes(ex))) continue;
    if (substrList.some((s) => hh.includes(s))) return h;
  }
  return null;
}

// Parses every column present in the sheet (not a fixed set), tags each row
// with metadata used for filtering (_year from the filename, _name/_class/_section
// detected from headers), and preserves original column order for display.
function parseSheetRows(sheet, fileName) {
  const raw = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
  if (!raw.length) return [];
  const headerRow = raw[0].map((h) => String(h ?? "").trim());
  const colIdxs = headerRow.map((h, i) => ({ h, i })).filter((c) => c.h);
  const columns = colIdxs.map((c) => c.h);

  const nameKey = findHeaderKey(
    columns,
    ["name", "student name"],
    ["name"],
    ["tamil", "father", "mother", "bank", "branch", "account"]
  );
  const classKey = findHeaderKey(columns, ["class", "std", "standard"], ["class", "standard"]);
  const sectionKey = findHeaderKey(columns, ["section", "sec"], ["section"]);
  const genderKey = findHeaderKey(columns, ["gender", "sex"], ["gender", "sex"]);
  const year = detectAcademicYear(fileName);

  return raw
    .slice(1)
    .filter((r) => r.some((c) => String(c ?? "").trim() !== ""))
    .map((r, idx) => {
      const obj = {};
      colIdxs.forEach(({ h, i }) => {
        obj[h] = String(r[i] ?? "").trim();
      });
      return {
        ...obj,
        _id: `${year}|${idx}|${nameKey ? obj[nameKey] : idx}`,
        _year: year || "Unspecified",
        _name: nameKey ? obj[nameKey] : "",
        _class: classKey ? obj[classKey] : "",
        _section: sectionKey ? obj[sectionKey] : "",
        _gender: genderKey ? obj[genderKey] : "",
      };
    })
    .filter((r) => r._name);
}

// Original column names in first-seen order, ignoring our internal _fields.
function rowColumns(rows) {
  const seen = [];
  const set = new Set();
  for (const r of rows) {
    for (const k of Object.keys(r)) {
      if (k.startsWith("_")) continue;
      if (!set.has(k)) {
        set.add(k);
        seen.push(k);
      }
    }
  }
  return seen;
}

  const [importError, setImportError] = useState(null);
  const [fileName, setFileName] = useState(null);

  const [year, setYear] = useState("");
  const [className, setClassName] = useState("");
  const [section, setSection] = useState("");
  const [nameQuery, setNameQuery] = useState("");
  const [selected, setSelected] = useState(null);
  const [page, setPage] = useState(1);
  const [pageSize, setPageSize] = useState(10);

  const years = useMemo(
    () => [...new Set(students.map((s) => s._year).filter(Boolean))].sort().reverse(),
    [students]
  );
  const classes = useMemo(
    () =>
      [...new Set(students.filter((s) => !year || s._year === year).map((s) => s._class).filter(Boolean))].sort(),
    [students, year]
  );
  const sections = useMemo(
    () =>
      [...new Set(
        students
          .filter((s) => (!year || s._year === year) && (!className || s._class === className))
          .map((s) => s._section)
          .filter(Boolean)
      )].sort(),
    [students, year, className]
  );

  const scoped = useMemo(
    () =>
      students.filter(
        (s) =>
          (!year || s._year === year) &&
          (!className || s._class === className) &&
          (!section || s._section === section)
      ),
    [students, year, className, section]
  );

  const matches = useMemo(() => {
    if (!nameQuery.trim()) return [];
    const q = nameQuery.trim().toLowerCase();
    return scoped.filter((s) => s._name.toLowerCase().includes(q)).slice(0, 8);
  }, [scoped, nameQuery]);

  // Only these fields are stored (locally and in Supabase), so the table
  // always has the same fixed columns regardless of what the sheet had.
  const columns = ["Name", "Gender", "Class", "Section", "Academic Year"];
  const columnValue = (s, c) =>
    c === "Name" ? s._name
    : c === "Gender" ? s._gender
    : c === "Class" ? s._class
    : c === "Section" ? s._section
    : s._year;
  const totalPages = Math.max(1, Math.ceil(scoped.length / pageSize));
  const pageRows = useMemo(
    () => scoped.slice((page - 1) * pageSize, page * pageSize),
    [scoped, page, pageSize]
  );

  useEffect(() => {
    setPage(1);
  }, [year, className, section, pageSize, students]);

  const handleFile = async (file) => {
    if (!file) return;
    setImportError(null);
    setImporting(true);
    setFileName(file.name);
    try {
      const buffer = await file.arrayBuffer();
      const bytes = new Uint8Array(buffer);
      const wb = XLSX.read(bytes, { type: "array" });
      if (!wb.SheetNames || wb.SheetNames.length === 0) {
        throw new Error("No sheets found in this file.");
      }
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = parseSheetRows(sheet, file.name);
      if (rows.length === 0) {
        setImportError(
          "No student rows found. Make sure there's a header row with a student name column (e.g. 'Name' or 'Student Name')."
        );
      } else {
        const importedYear = rows[0]._year;
        const skipped = await importRows(rows);
        setYear(importedYear === "Unspecified" ? "" : importedYear);
        setClassName("");
        setSection("");
        if (skipped && skipped.length) {
          setImportError(
            `Imported, but couldn't remove ${skipped.length} student${skipped.length === 1 ? "" : "s"} no longer in the sheet ` +
            `because they already have attendance recorded: ${skipped.join(", ")}. They're kept on the roster so that history isn't lost.`
          );
        }
      }
    } catch (e) {
      console.error("Excel import failed:", e);
      setImportError(
        `Could not read that file (${e?.message || "unknown error"}). Please upload a valid .xlsx, .xls or .csv file.`
      );
    } finally {
      setImporting(false);
    }
  };

          Only Name, Gender, Class, Section and Academic Year are saved (to the Supabase database) — any other

          "…2026_2027…") — name the file accordingly before uploading.

          <button
            onClick={() => fileRef.current?.click()}

            style={{ background: THEME.gradient }}
          >
            <Icon glyph="upload" size={15} />

                        <td className="px-2 py-3 text-center" colSpan={columns.length || 1} style={{ color: THEME.inkSoft }}>
                          No students to show.
                        </td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>

              {scoped.length > 0 && (
                <div className="flex items-center justify-between mt-2 text-xs" style={{ color: THEME.inkSoft }}>
                  <span>
                    Page {page} of {totalPages}
                  </span>
                  <div className="flex gap-2">
                    <button
                      onClick={() => setPage((p) => Math.max(1, p - 1))}
                      disabled={page <= 1}
                      className="px-3 py-1 rounded-xl"
                      style={{ border: `1px solid ${THEME.paperDark}`, opacity: page <= 1 ? 0.5 : 1 }}
                    >
                      Prev
                    </button>
                    <button
                      onClick={() => setPage((p) => Math.min(totalPages, p + 1))}
                      disabled={page >= totalPages}
                      className="px-3 py-1 rounded-xl"
                      style={{ border: `1px solid ${THEME.paperDark}`, opacity: page >= totalPages ? 0.5 : 1 }}
                    >
                      Next
                    </button>
                  </div>
                </div>
              )}
            </div>

            {/* Print-only: full (unpaginated) table for the current filter scope */}
            <div className="print-area" style={{ display: "none" }}>
              <div className="print-header">
                <div style={{ fontWeight: "bold" }}>
                  Reena's Student's Tracking — Student List
                </div>
                <div>
                  {[
                    year && `Academic Year: ${year}`,
                    className && `Class: ${className}`,
                    section && `Section: ${section}`,
                  ].filter(Boolean).join("  |  ") || "All students"}
                  {"  |  "}
                  {scoped.length} student{scoped.length === 1 ? "" : "s"}
                  {"  |  "}
                  Printed {new Date().toLocaleDateString()}
                </div>
              </div>
              <table>
                <thead>
                  <tr>
                    {columns.map((c) => (
                      <th key={c}>{c}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {scoped.map((s) => (
                    <tr key={s._id}>
                      {columns.map((c) => (
                        <td key={c}>{columnValue(s, c) || ""}</td>
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            </>
          )
        )}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Attendance — mark today's present/absent per student, filtered by
// academic year / class / section / name, same filtering pattern as Students.
// ---------------------------------------------------------------------------
function AttendanceTab({ students, attendance, onMark, onMarkBulk, ready }) {
  const [year, setYear] = useState("");
  const [className, setClassName] = useState("");
  const [section, setSection] = useState("");
  const [nameQuery, setNameQuery] = useState("");

  const todayStr = new Date().toISOString().slice(0, 10);
  const [selectedDate, setSelectedDate] = useState(todayStr);
  const isToday = selectedDate === todayStr;
  const dayAttendance = attendance[selectedDate] || {};

  const years = useMemo(
    () => [...new Set(students.map((s) => s._year).filter(Boolean))].sort().reverse(),
    [students]
  );
  const classes = useMemo(
    () =>
      [...new Set(students.filter((s) => !year || s._year === year).map((s) => s._class).filter(Boolean))].sort(),
    [students, year]
  );
  const sections = useMemo(
    () =>
      [...new Set(
        students
          .filter((s) => (!year || s._year === year) && (!className || s._class === className))
          .map((s) => s._section)
          .filter(Boolean)
      )].sort(),
    [students, year, className]
  );

  const scoped = useMemo(() => {
    const q = nameQuery.trim().toLowerCase();
    return students.filter(
      (s) =>
        (!year || s._year === year) &&
        (!className || s._class === className) &&
        (!section || s._section === section) &&
        (!q || s._name.toLowerCase().includes(q))
    );
  }, [students, year, className, section, nameQuery]);

  const scopedAbsent = scoped.filter((s) => dayAttendance[s._id] === "absent").length;
  const scopedPresent = scoped.length - scopedAbsent; // unmarked students count as present by default

  const toggleAbsent = (studentId) => {
    const current = dayAttendance[studentId];
    onMark(studentId, selectedDate, current === "absent" ? null : "absent"); // tap again to clear
  };

  // Same WhatsApp-ready summary as the dashboard card, built from whatever
  // year/class/section/date is currently filtered here — lets a teacher
  // share straight from this screen without switching tabs.
  const selectedDateLabel = new Date(selectedDate + "T00:00:00").toLocaleDateString(undefined, {
    weekday: "short",
    year: "numeric",
    month: "short",
    day: "numeric",
  });
  const scopeLabel = [className, section].filter(Boolean).join(" '") + (section ? "'" : "");
  const shareLabel = scopeLabel || (year ? `AY ${year}` : "All students");
  const monthPrefix = selectedDate.slice(0, 7);
  const monthLabel = new Date(selectedDate + "T00:00:00").toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const monthlyAbsenceCounts = useMemo(() => {
    const counts = {};
    Object.keys(attendance).forEach((date) => {
      if (!date.startsWith(monthPrefix)) return;
      const day = attendance[date];
      scoped.forEach((s) => {
        if (day[s._id] === "absent") counts[s._id] = (counts[s._id] || 0) + 1;
      });
    });
    return counts;
  }, [attendance, scoped, monthPrefix]);

  const buildShareText = () => {
    const absentList = scoped
      .filter((s) => dayAttendance[s._id] === "absent")
      .sort((a, b) => genderRank(a._gender) - genderRank(b._gender) || a._name.localeCompare(b._name));
    const frequentAbsentees = scoped
      .filter((s) => (monthlyAbsenceCounts[s._id] || 0) > 2)
      .sort((a, b) => (monthlyAbsenceCounts[b._id] || 0) - (monthlyAbsenceCounts[a._id] || 0));
    const lines = [
      `📋 ${selectedDate === todayStr ? "Today's" : selectedDateLabel} Attendance – ${shareLabel}`,
      `📅 ${selectedDateLabel}`,
      "",
      `Present: ${scopedPresent}`,
      `Absent: ${scopedAbsent}`,
    ];
    if (absentList.length) {
      lines.push("", "Absentees:");
      absentList.forEach((s, i) => lines.push(`${i + 1}. ${s._name}`));
    }
    if (frequentAbsentees.length) {
      lines.push("", `⚠️ Leave taken > 2 days in ${monthLabel}:`);
      frequentAbsentees.forEach((s, i) => lines.push(`${i + 1}. ${s._name} (${monthlyAbsenceCounts[s._id]} days)`));
    }
    return lines.join("\n");
  };

  const canShare = typeof navigator !== "undefined" && !!navigator.share;
  const [copied, setCopied] = useState(false);
  const shareSummary = async () => {
    const text = buildShareText();
    if (canShare) {
      try {
        await navigator.share({ title: `Attendance – ${shareLabel}`, text });
      } catch (e) {
        // cancelled or unsupported — nothing to do
      }
      return;
    }
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand("copy"); } catch (err) {}
      document.body.removeChild(ta);
    }
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  return (
    <div>
      <div className="rounded-2xl p-4" style={{ background: THEME.paper, border: "none", boxShadow: "0 1px 3px rgba(15,23,42,0.08)" }}>
        <div className="flex items-center justify-between gap-2">
          <h2 className="text-sm font-semibold uppercase tracking-wide" style={{ color: THEME.inkSoft, letterSpacing: "0.1em" }}>
            Attendance
          </h2>
          <div className="flex items-center gap-1.5">
            {!isToday && (
              <button
                onClick={() => setSelectedDate(todayStr)}
                className="text-xs font-semibold px-2.5 py-1 rounded-xl"
                style={{ background: THEME.boardGreenSoft, color: THEME.boardGreen }}
              >
                Today
              </button>
            )}
            <div className="relative">
              <Icon glyph="calendar" size={13} className="absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none" />
              <input
                type="date"
                value={selectedDate}
                max={todayStr}
                onChange={(e) => e.target.value && setSelectedDate(e.target.value)}
                className="pl-7 pr-2 py-1.5 text-xs font-semibold rounded-xl outline-none"
                style={{ border: `1px solid ${THEME.paperDark}`, background: THEME.chalk, color: THEME.ink }}
              />
            </div>
          </div>
        </div>
        {!isToday && (
          <div
            className="mt-2 text-xs font-semibold px-3 py-1.5 rounded-xl inline-block"
            style={{ background: THEME.marigoldSoft, color: "#8A6300" }}
          >
            Viewing {new Date(selectedDate + "T00:00:00").toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "short", day: "numeric" })}
          </div>
        )}

        <div className="mt-3 grid grid-cols-1 sm:grid-cols-4 gap-2">
          <select
            value={year}
            onChange={(e) => { setYear(e.target.value); setClassName(""); setSection(""); }}
            className="px-3 py-2 text-sm rounded-xl outline-none"
            style={{ border: `1px solid ${THEME.paperDark}`, background: THEME.chalk }}
          >
            <option value="">Academic year — all</option>
            {years.map((y) => <option key={y} value={y}>{y}</option>)}
          </select>
          <select
            value={className}
            onChange={(e) => { setClassName(e.target.value); setSection(""); }}
            className="px-3 py-2 text-sm rounded-xl outline-none"
            style={{ border: `1px solid ${THEME.paperDark}`, background: THEME.chalk }}
          >
            <option value="">Class — all</option>
            {classes.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
          <select
            value={section}
            onChange={(e) => setSection(e.target.value)}
            className="px-3 py-2 text-sm rounded-xl outline-none"
            style={{ border: `1px solid ${THEME.paperDark}`, background: THEME.chalk }}
          >
            <option value="">Section — all</option>
            {sections.map((s) => <option key={s} value={s}>{s}</option>)}
          </select>
          <div className="relative">
            <Icon glyph="search" size={14} className="absolute left-3 top-1/2 -translate-y-1/2" style={{ color: THEME.inkSoft }} />
            <input
              value={nameQuery}
              onChange={(e) => setNameQuery(e.target.value)}
              placeholder="Student name…"
              className="w-full pl-8 pr-3 py-2 text-sm rounded-xl outline-none"
              style={{ border: `1px solid ${THEME.paperDark}`, background: THEME.chalk }}
            />
          </div>
        </div>

        <div className="mt-3 flex flex-wrap items-center justify-between gap-2">
          <div className="text-xs" style={{ color: THEME.inkSoft }}>
            {scoped.length} student{scoped.length === 1 ? "" : "s"} in this scope
            {"  ·  "}
            <span style={{ color: THEME.green, fontWeight: 600 }}>{scopedPresent} present</span>
            {"  ·  "}
            <span style={{ color: THEME.coral, fontWeight: 600 }}>{scopedAbsent} absent</span>
          </div>
          {scoped.length > 0 && (
            <button
              onClick={shareSummary}
              className="flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-full flex-shrink-0"
              style={{ background: copied ? THEME.green : THEME.gradient, color: "#fff" }}
            >
              <Icon glyph={canShare ? "share" : "clipboard"} size={13} />
              {canShare ? "Share summary" : copied ? "Copied!" : "Copy summary"}
            </button>
          )}
        </div>
        <p className="mt-1.5 text-xs" style={{ color: THEME.inkSoft }}>
          Everyone is marked <b>Present</b> by default — just tap <b>Absent</b> for the students who are out.
        </p>

        <div className="mt-3 rounded-xl overflow-hidden" style={{ border: `1px solid ${THEME.paperDark}`, maxHeight: "60vh", overflowY: "auto" }}>
          {!ready && (
            <div className="text-sm px-3 py-4 text-center" style={{ color: THEME.inkSoft }}>Loading…</div>
          )}
          {ready && scoped.length === 0 && (
            <div className="text-sm px-3 py-4 text-center" style={{ color: THEME.inkSoft }}>
              No students to show. Import a student list from the Students tab first.
            </div>
          )}
          {scoped.map((s, i) => {
            const status = dayAttendance[s._id];
            return (
              <div
                key={s._id}
                className="flex items-center justify-between gap-2 px-3 py-2.5"
                style={{ background: i % 2 ? THEME.paper : THEME.chalk, borderTop: i ? `1px solid ${THEME.paperDark}` : "none" }}
              >
                <div className="min-w-0">
                  <div className="text-sm font-medium truncate" style={{ color: THEME.ink }}>{s._name}</div>
                  <div className="text-xs" style={{ color: THEME.inkSoft, fontFamily: "'JetBrains Mono', monospace" }}>
                    {s._class}{s._section ? `-${s._section}` : ""}
                  </div>
                </div>
                <div className="flex items-center gap-2 flex-shrink-0">
                  {status !== "absent" && (
                    <span
                      className="px-2.5 py-1 rounded-xl text-xs font-semibold"
                      style={{ background: THEME.greenSoft, color: THEME.greenDark }}
                    >
                      Present
                    </span>
                  )}
                  <button
                    onClick={() => toggleAbsent(s._id)}
                    className="px-3 py-1.5 rounded-xl text-xs font-semibold"
                    style={{
                      background: status === "absent" ? THEME.coral : THEME.chalk,
                      color: status === "absent" ? "#fff" : THEME.inkSoft,
                      border: `1px solid ${status === "absent" ? THEME.coral : THEME.paperDark}`,
                    }}
                  >
                    {status === "absent" ? "Absent ✕" : "Absent"}
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Timetable — editable weekly grid, persisted
// ---------------------------------------------------------------------------
function TimetableTab({ timetable, setTimetable, ready }) {
  const [editingKey, setEditingKey] = useState(null);
  const [draft, setDraft] = useState("");
  const [selectedDay, setSelectedDay] = useState(null); // null = full week grid

  const openCell = (dayIdx, period) => {
    const key = `${dayIdx}-${period}`;
    setEditingKey(key);
    setDraft(timetable[key] || "");
  };

  const saveCell = () => {
    if (!editingKey) return;
    const next = { ...timetable };
    if (draft.trim()) next[editingKey] = draft.trim();
    else delete next[editingKey];
    setTimetable(next);
    setEditingKey(null);
    setDraft("");
  };

  return (
    <div>
      <div className="rounded-2xl p-4 sm:p-5" style={{ background: THEME.paper, border: "none", boxShadow: "0 1px 3px rgba(15,23,42,0.08)" }}>
        <div className="flex items-center justify-between">
          <h2 className="text-sm font-semibold uppercase tracking-wide" style={{ color: THEME.inkSoft, letterSpacing: "0.1em" }}>
            Weekly Timetable
          </h2>
          <span className="text-xs" style={{ color: THEME.inkSoft }}>
            {ready ? "Tap a period to edit" : "Loading…"}
          </span>
        </div>

        {/* Day navigator — jump to any day, not just today */}
        <div className="flex gap-1.5 mt-4 overflow-x-auto pb-1">
          <button
            onClick={() => setSelectedDay(null)}
            className="px-3 py-1.5 text-xs rounded-xl whitespace-nowrap"
            style={{
              background: selectedDay === null ? THEME.boardGreen : THEME.chalk,
              color: selectedDay === null ? THEME.chalk : THEME.inkSoft,
              border: `1px solid ${selectedDay === null ? THEME.boardGreen : THEME.paperDark}`,
              fontWeight: selectedDay === null ? 600 : 500,
            }}
          >
            Full Week
          </button>
          {DAYS.map((d, i) => {
            const active = selectedDay === i;
            const isToday = i === TODAY_INDEX;
            return (
              <button
                key={d}
                onClick={() => setSelectedDay(i)}
                className="px-3 py-1.5 text-xs rounded-xl whitespace-nowrap"
                style={{
                  background: active ? THEME.marigold : THEME.chalk,
                  color: active ? THEME.chalk : THEME.inkSoft,
                  border: `1px solid ${active ? THEME.marigold : isToday ? THEME.moss : THEME.paperDark}`,
                  fontWeight: active || isToday ? 600 : 500,
                }}
              >
                {d}{isToday ? " •" : ""}
              </button>
            );
          })}
        </div>

        {selectedDay === null ? (
          <div className="mt-4 overflow-x-auto">
            <table className="w-full text-sm border-collapse" style={{ minWidth: 560 }}>
              <thead>
                <tr>
                  <th
                    className="text-left px-2 py-2 text-xs uppercase"
                    style={{ color: THEME.chalk, background: THEME.boardGreen, letterSpacing: "0.08em" }}
                  >
                    Period
                  </th>
                  {DAYS.map((d, i) => (
                    <th
                      key={d}
                      className="px-2 py-2 text-xs uppercase cursor-pointer"
                      onClick={() => setSelectedDay(i)}
                      style={{
                        color: THEME.chalk,
                        background: i === TODAY_INDEX ? THEME.marigold : THEME.boardGreen,
                        letterSpacing: "0.08em",
                      }}
                    >
                      {d}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {PERIODS.map((p) => (
                  <tr key={p}>
                    <td
                      className="px-2 py-2 text-xs font-medium"
                      style={{ background: THEME.paperDark, color: THEME.inkSoft, fontFamily: "'JetBrains Mono', monospace" }}
                    >
                      P{p}
                    </td>
                    {DAYS.map((_, dayIdx) => {
                      const key = `${dayIdx}-${p}`;
                      const value = timetable[key];
                      const isEditing = editingKey === key;
                      return (
                        <td
                          key={key}
                          className="px-1.5 py-1.5 align-top"
                          style={{ background: THEME.chalk, border: `1px solid ${THEME.paperDark}` }}
                        >
                          {isEditing ? (
                            <div className="flex flex-col gap-1">
                              <input
                                autoFocus
                                value={draft}
                                onChange={(e) => setDraft(e.target.value)}
                                onKeyDown={(e) => e.key === "Enter" && saveCell()}
                                placeholder="e.g. 11-A Botany"
                                className="w-full px-1.5 py-1 text-xs rounded-xl outline-none"
                                style={{ border: `1px solid ${THEME.moss}` }}
                              />
                              <div className="flex gap-1">
                                <button
                                  onClick={saveCell}
                                  className="flex-1 text-xs py-1 rounded-xl text-white"
                                  style={{ background: THEME.moss }}
                                >
                                  Save
                                </button>
                                <button
                                  onClick={() => setEditingKey(null)}
                                  className="text-xs px-2 py-1 rounded-xl"
                                  style={{ border: `1px solid ${THEME.paperDark}` }}
                                >
                                  <Icon glyph="x" size={12} />
                                </button>
                              </div>
                            </div>
                          ) : (
                            <button
                              onClick={() => openCell(dayIdx, p)}
                              className="w-full text-left text-xs px-1.5 py-2 rounded-xl"
                              style={{ minHeight: "2.25rem", color: value ? THEME.ink : THEME.paperDark, background: "transparent" }}
                            >
                              {value || "+"}
                            </button>
                          )}
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        ) : (
          <div className="mt-4">
            <div className="flex items-center justify-between mb-2">
              <button
                onClick={() => setSelectedDay((d) => (d - 1 + DAYS.length) % DAYS.length)}
                className="px-3 py-1.5 text-xs rounded-xl"
                style={{ border: `1px solid ${THEME.paperDark}`, color: THEME.inkSoft }}
              >
                ← {DAYS[(selectedDay - 1 + DAYS.length) % DAYS.length]}
              </button>
              <div className="text-sm font-semibold" style={{ color: THEME.ink, fontFamily: "'Poppins', sans-serif" }}>
                {DAYS[selectedDay]}{selectedDay === TODAY_INDEX ? " (Today)" : ""}
              </div>
              <button
                onClick={() => setSelectedDay((d) => (d + 1) % DAYS.length)}
                className="px-3 py-1.5 text-xs rounded-xl"
                style={{ border: `1px solid ${THEME.paperDark}`, color: THEME.inkSoft }}
              >
                {DAYS[(selectedDay + 1) % DAYS.length]} →
              </button>
            </div>
            <div className="rounded-xl overflow-hidden" style={{ border: `1px solid ${THEME.paperDark}` }}>
              {PERIODS.map((p, i) => {
                const key = `${selectedDay}-${p}`;
                const value = timetable[key];
                const isEditing = editingKey === key;
                return (
                  <div
                    key={p}
                    className="flex items-center gap-3 px-3 py-2.5"
                    style={{ background: i % 2 ? THEME.paper : THEME.chalk, borderTop: i ? `1px solid ${THEME.paperDark}` : "none" }}
                  >
                    <div
                      className="text-xs font-medium w-10 flex-shrink-0"
                      style={{ color: THEME.inkSoft, fontFamily: "'JetBrains Mono', monospace" }}
                    >
                      P{p}
                    </div>
                    {isEditing ? (
                      <div className="flex-1 flex gap-2">
                        <input
                          autoFocus
                          value={draft}
                          onChange={(e) => setDraft(e.target.value)}
                          onKeyDown={(e) => e.key === "Enter" && saveCell()}
                          placeholder="e.g. 11-A Botany"
                          className="flex-1 px-2 py-1.5 text-sm rounded-xl outline-none"
                          style={{ border: `1px solid ${THEME.moss}` }}
                        />
                        <button onClick={saveCell} className="text-xs px-3 py-1.5 rounded-xl text-white" style={{ background: THEME.moss }}>
                          Save
                        </button>
                        <button
                          onClick={() => setEditingKey(null)}
                          className="text-xs px-2 py-1.5 rounded-xl"
                          style={{ border: `1px solid ${THEME.paperDark}` }}
                        >
                          <Icon glyph="x" size={12} />
                        </button>
                      </div>
                    ) : (
                      <button
                        onClick={() => openCell(selectedDay, p)}
                        className="flex-1 text-left text-sm px-2 py-1.5 rounded-xl"
                        style={{ color: value ? THEME.ink : THEME.inkSoft }}
                      >
                        {value || "+ Add class"}
                      </button>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

try {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
} catch (e) {
  console.error("App render failed:", e);
  document.getElementById("root").innerHTML =
    '<div style="font-family: sans-serif; padding: 24px; color: #444; max-width: 480px; margin: 0 auto;">' +
    'Could not load the app — it hit an error while starting up.<br><br>Details:<br>' +
    (e && e.message ? e.message : String(e)) +
    '</div>';
}
</script>
