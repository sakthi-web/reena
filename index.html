// ---------------------------------------------------------------------------
// localStorage-backed storage shim, matching the window.storage API shape
// used by usePersistentState below (get/set only — this app doesn't need
// delete/list). Swap this out if you later add a real backend.
// ---------------------------------------------------------------------------
const storage = {
  get: async (key) => {
    const v = window.localStorage.getItem(key);
    if (v === null) throw new Error("not found");
    return { key, value: v };
  },
  set: async (key, value) => {
    window.localStorage.setItem(key, value);
    return { key, value };
  },
};

// ---------------------------------------------------------------------------
// Persistent storage hook — reads/writes the artifact key-value store.
// ---------------------------------------------------------------------------
function usePersistentState(key, initialValue) {
  const [value, setValue] = useState(initialValue);
  const [ready, setReady] = useState(false);
  const [error, setError] = useState(null);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const result = await storage.get(key);
        if (!cancelled && result && result.value) {
          setValue(JSON.parse(result.value));
        }
      } catch (e) {
        // key not found yet — keep initial value
      } finally {
        if (!cancelled) setReady(true);
      }
    })();
    return () => {
      cancelled = true;
    };
  }, [key]);

  const persist = async (next) => {
    const resolved = typeof next === "function" ? next(value) : next;
    setValue(resolved);
    try {
      const result = await storage.set(key, JSON.stringify(resolved));
      if (!result) setError("Could not save. Your changes may not persist.");
      else setError(null);
    } catch (e) {
      setError("Could not save. Your changes may not persist.");
    }
  };

  return [value, persist, ready, error];
}

function LeafDivider() {

      <span style={{ height: 1, background: THEME.moss, flex: 1, opacity: 0.5 }} />
      <Icon glyph="leaf" size={13} style={{ color: THEME.moss }} />
      <span style={{ height: 1, background: THEME.moss, flex: 1, opacity: 0.5 }} />
    </div>
  );
}

function SpecimenCard({ eyebrow, title, value, sub, accent, onClick }) {
  return (
    <div
      role={onClick ? "button" : undefined}
      tabIndex={onClick ? 0 : undefined}
      onClick={onClick}
      onKeyDown={(e) => {
        if (onClick && (e.key === "Enter" || e.key === " ")) {
          e.preventDefault();
          onClick();
        }
      }}
      className="rounded-2xl p-5 flex-1 min-w-0 transition-shadow"
      style={{
        background: THEME.paper,
        border: `1px solid ${THEME.line}`,
        borderTop: `3px solid ${accent || THEME.green}`,
        cursor: onClick ? "pointer" : "default",
      }}
    >
      <div
        className="text-xs uppercase font-semibold tracking-widest"
        style={{ color: THEME.inkSoft, letterSpacing: "0.14em" }}
      >
        {eyebrow}
      </div>
      <div
        className="mt-2 text-4xl"
        style={{ fontFamily: "Fraunces, serif", color: THEME.ink, fontWeight: 600 }}
      >
        {value}
      </div>
      <div className="mt-1 text-sm" style={{ color: THEME.inkSoft }}>
        {title}
      </div>
      {sub && (
        <div className="mt-3 text-xs" style={{ color: accent || THEME.green, fontFamily: "'JetBrains Mono', monospace" }}>
          {sub}
        </div>
      )}
      {onClick && (
        <div className="mt-2 text-xs font-medium" style={{ color: accent || THEME.green }}>
          View →
        </div>
      )}
    </div>
  );
}

// ---------------------------------------------------------------------------
// Sheet — bottom modal (mobile) / centered modal (desktop), dismissable
// ---------------------------------------------------------------------------
function Sheet({ title, children, onClose }) {
  return (
    <div
      className="fixed inset-0 z-40 flex items-end sm:items-center sm:justify-center"
      style={{ background: "rgba(32,40,31,0.5)" }}
      onClick={onClose}
    >
      <div
        className="bg-white w-full sm:max-w-md sm:rounded-2xl rounded-t-2xl p-5"
        style={{ maxHeight: "88vh", overflowY: "auto" }}
        onClick={(e) => e.stopPropagation()}
      >
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-lg" style={{ fontFamily: "Fraunces, serif", fontWeight: 600, color: THEME.ink }}>{title}</h3>
          <button
            onClick={onClose}
            className="w-8 h-8 rounded-full flex items-center justify-center"
            style={{ background: THEME.chalk }}
            aria-label="Close"
          >
            <Icon glyph="x" size={14} style={{ color: THEME.ink }} />
          </button>
        </div>
        {children}
      </div>
    </div>
  );
}

// Small pill-style quick-action button (icon badge + title + subtitle),
// echoing the reference plant-store app's tappable info pills.
function QuickAction({ icon, iconBg, iconColor, title, subtitle, onClick }) {
  return (
    <button
      onClick={onClick}
      className="rounded-2xl p-4 flex items-center gap-3 text-left transition-shadow"
      style={{ background: THEME.paper, border: `1px solid ${THEME.line}` }}

      <div
        className="w-10 h-10 rounded-xl flex items-center justify-center shrink-0"
        style={{ background: iconBg }}
      >
        <Icon glyph={icon} size={18} style={{ color: iconColor }} />
      </div>
      <div>
        <div className="text-sm font-semibold" style={{ color: THEME.ink }}>{title}</div>
        <div className="text-xs" style={{ color: THEME.inkSoft }}>{subtitle}</div>

}

// Main App

            >

            </div>

              XI &amp; XII · Tamil Nadu Govt. Higher Secondary School

          </div>
        </div>

                style={{ color: active ? THEME.marigoldSoft : THEME.chromeText, opacity: active ? 1 : 0.75 }}
              >
                <Icon glyph={icon} size={18} />
                <span style={{ fontWeight: active ? 700 : 500 }}>{label}</span>

  );
}

// ---------------------------------------------------------------------------
// Dashboard
// ---------------------------------------------------------------------------
function DashboardTab({ students, timetable, exams, setExams, ready, setTab }) {
  const [showExamForm, setShowExamForm] = useState(false);
  const [examName, setExamName] = useState("");
  const [examClass, setExamClass] = useState("11th");
  const [examDate, setExamDate] = useState("");
  const examSectionRef = useRef(null);
  const [showDictionary, setShowDictionary] = useState(false);
  const [showTranslator, setShowTranslator] = useState(false);

  const totalStudents = students.length;

  const classesToday =
    TODAY_INDEX === -1
      ? 0
      : PERIODS.filter((p) => (timetable[`${TODAY_INDEX}-${p}`] || "").trim() !== "").length;

  const todayLabel = TODAY_INDEX === -1 ? "Sunday" : DAYS[TODAY_INDEX];

  const upcoming = useMemo(() => {
    const todayStr = new Date().toISOString().slice(0, 10);
    return [...exams]
      .filter((e) => e.date >= todayStr)
      .sort((a, b) => a.date.localeCompare(b.date));
  }, [exams]);

  const addExam = () => {
    if (!examName.trim() || !examDate) return;
    const next = [
      ...exams,
      { id: Date.now().toString(), name: examName.trim(), className: examClass, date: examDate },
    ];
    setExams(next);
    setExamName("");
    setExamDate("");
    setShowExamForm(false);
  };

  const removeExam = (id) => setExams(exams.filter((e) => e.id !== id));

  const goToExams = () => {
    setShowExamForm(true);
    examSectionRef.current?.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  return (
    <div>
      {/* Quick actions */}
      <div className="grid grid-cols-2 gap-3 mb-4">
        <QuickAction
          icon="book"
          iconBg={THEME.greenSoft}
          iconColor={THEME.greenDark}
          title="Dictionary"
          subtitle="English & Botany terms"
          onClick={() => setShowDictionary(true)}
        />
        <QuickAction
          icon="translate"
          iconBg={THEME.marigoldSoft}
          iconColor="#8A6300"
          title="Translator"
          subtitle="English · Tamil · Hindi"
          onClick={() => setShowTranslator(true)}
        />
      </div>

      <div className="flex flex-col sm:flex-row gap-4">
        <SpecimenCard
          eyebrow="Roster"
          title="Students on record"
          value={ready ? totalStudents : "…"}
          sub={totalStudents === 0 ? "Import an Excel sheet to begin" : "across XI & XII"}
          accent={THEME.green}
          onClick={() => setTab("students")}
        />
        <SpecimenCard
          eyebrow={todayLabel}
          title="Classes today"
          value={ready ? classesToday : "…"}
          sub={TODAY_INDEX === -1 ? "No periods on Sunday" : "from your timetable"}
          accent={THEME.marigold}
          onClick={() => setTab("timetable")}
        />
        <SpecimenCard
          eyebrow="Ahead"
          title="Upcoming exams"
          value={ready ? upcoming.length : "…"}
          sub={upcoming[0] ? `Next: ${upcoming[0].name} · ${upcoming[0].date}` : "Nothing scheduled"}
          accent={THEME.coral}
          onClick={goToExams}
        />
      </div>

      <LeafDivider />

      <div ref={examSectionRef} className="rounded-2xl p-4 sm:p-5" style={{ background: THEME.paper, border: `1px solid ${THEME.line}` }}>
        <div className="flex items-center justify-between">
          <h2 className="text-sm font-semibold uppercase tracking-wide" style={{ color: THEME.inkSoft, letterSpacing: "0.1em" }}>
            Exam Register
          </h2>
          <button
            onClick={() => setShowExamForm((s) => !s)}
            className="flex items-center gap-1 text-sm px-3 py-1.5 rounded-xl text-white"
            style={{ background: THEME.green }}
          >
            {showExamForm ? <Icon glyph="x" size={14} /> : <Icon glyph="plus" size={14} />}
            {showExamForm ? "Cancel" : "Add exam"}
          </button>
        </div>

        {showExamForm && (
          <div className="mt-4 grid grid-cols-1 sm:grid-cols-4 gap-2">
            <input
              value={examName}
              onChange={(e) => setExamName(e.target.value)}
              placeholder="Exam name (e.g. Botany Unit Test)"
              className="sm:col-span-2 px-3 py-2 text-sm rounded-xl outline-none"
              style={{ border: `1px solid ${THEME.line}`, background: THEME.chalk }}
            />
            <select
              value={examClass}
              onChange={(e) => setExamClass(e.target.value)}
              className="px-3 py-2 text-sm rounded-xl outline-none"
              style={{ border: `1px solid ${THEME.line}`, background: THEME.chalk }}
            >
              <option>11th</option>
              <option>12th</option>
            </select>
            <input
              type="date"
              value={examDate}
              onChange={(e) => setExamDate(e.target.value)}
              className="px-3 py-2 text-sm rounded-xl outline-none"
              style={{ border: `1px solid ${THEME.line}`, background: THEME.chalk }}
            />
            <button
              onClick={addExam}
              className="sm:col-span-4 mt-1 text-sm px-3 py-2 rounded-xl text-white"
              style={{ background: THEME.marigold }}
            >
              Save exam
            </button>
          </div>
        )}

        <div className="mt-4 divide-y" style={{ borderColor: THEME.line }}>
          {exams.length === 0 && (
            <div className="text-sm py-3" style={{ color: THEME.inkSoft }}>
              No exams added yet.
            </div>
          )}
          {[...exams]
            .sort((a, b) => a.date.localeCompare(b.date))
            .map((e) => (
              <div key={e.id} className="flex items-center justify-between py-2.5" style={{ borderTopColor: THEME.line, borderTopWidth: 1 }}>
                <div>
                  <div className="text-sm font-medium" style={{ color: THEME.ink }}>{e.name}</div>
                  <div className="text-xs" style={{ color: THEME.inkSoft, fontFamily: "'JetBrains Mono', monospace" }}>
                    {e.className} · {e.date}
                  </div>
                </div>
                <button onClick={() => removeExam(e.id)} aria-label={`Remove ${e.name}`}>
                  <Icon glyph="trash" size={15} style={{ color: THEME.coral }} />
                </button>
              </div>
            ))}
        </div>
      </div>

      {showDictionary && <DictionarySheet onClose={() => setShowDictionary(false)} />}
      {showTranslator && <TranslatorSheet onClose={() => setShowTranslator(false)} />}
    </div>
  );
}

// ---------------------------------------------------------------------------
// Dictionary & Translator — Sheet-based, English/Tamil/Hindi + botany glossary
// ---------------------------------------------------------------------------
const LANGUAGES = [
  { code: "en", label: "English" },
  { code: "ta", label: "Tamil" },
  { code: "hi", label: "Hindi" },
];

// A focused biology/botany glossary — searched locally, no internet needed.
const BOTANY_DICTIONARY = [
  { term: "Photosynthesis", definition: "The process by which green plants use sunlight to synthesize food from carbon dioxide and water.", ta: "ஒளிச்சேர்க்கை", hi: "प्रकाश संश्लेषण" },
  { term: "Chlorophyll", definition: "The green pigment in plants responsible for absorbing light for photosynthesis.", ta: "பசுங்கணிகம்", hi: "क्लोरोफिल" },
  { term: "Stomata", definition: "Tiny pores on a leaf surface that allow gas exchange and water vapor release.", ta: "இலைத்துளை", hi: "रंध्र" },
  { term: "Xylem", definition: "Plant tissue that conducts water and dissolved minerals from roots to the rest of the plant.", ta: "நீர்க்குழாய் திசு", hi: "जाइलम" },
  { term: "Phloem", definition: "Plant tissue that transports food (sugars) made in the leaves to other parts of the plant.", ta: "உணவுக்குழாய் திசு", hi: "फ्लोएम" },
  { term: "Transpiration", definition: "Loss of water vapor from plant leaves, mainly through stomata.", ta: "வேர்வையிடல்", hi: "वाष्पोत्सर्जन" },
  { term: "Pollination", definition: "Transfer of pollen from the anther to the stigma of a flower.", ta: "மகரந்தச் சேர்க்கை", hi: "परागण" },
  { term: "Fertilization", definition: "Fusion of male and female gametes to form a zygote.", ta: "கருவுறுதல்", hi: "निषेचन" },
  { term: "Respiration", definition: "The process of breaking down glucose to release energy, using or not using oxygen.", ta: "சுவாசம்", hi: "श्वसन" },
  { term: "Mitosis", definition: "Cell division that produces two genetically identical daughter cells.", ta: "சமபிரிவு", hi: "समसूत्री विभाजन" },
  { term: "Meiosis", definition: "Cell division that produces four genetically different gametes with half the chromosome number.", ta: "குறுக்கல் பிரிவு", hi: "अर्धसूत्री विभाजन" },
  { term: "Osmosis", definition: "Movement of water across a semi-permeable membrane from a less to a more concentrated solution.", ta: "சவ்வூடு பரவல்", hi: "परासरण" },
  { term: "Chromosome", definition: "A thread-like structure of DNA that carries genetic information.", ta: "நிறமூர்த்தம்", hi: "गुणसूत्र" },
  { term: "Genotype", definition: "The genetic makeup of an organism.", ta: "மரபணு அமைப்பு", hi: "जीनोटाइप" },

function TranslatorSheet({ onClose }) {
  const [from, setFrom] = useState("en");
  const [to, setTo] = useState("ta");
  const [text, setText] = useState("");
  const [result, setResult] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const swapLangs = () => {
    setFrom(to);
    setTo(from);
    setText(result);
    setResult("");
  };

  const translate = async () => {
    const q = text.trim();
    if (!q || from === to) return;
    setLoading(true);
    setError("");
    setResult("");
    try {
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=${from}|${to}`);
      if (!res.ok) throw new Error(`Request failed (${res.status})`);
      const data = await res.json();
      const translated = data?.responseData?.translatedText;
      if (!translated) throw new Error("No translation returned");
      setResult(translated);
    } catch (e) {
      console.error("Translation failed:", e);
      setError("Couldn't translate that — check your internet connection and try again.");
    } finally {
      setLoading(false);
    }
  };

  return (
    <Sheet onClose={onClose} title="Translator">
      <div className="flex items-center gap-2 mb-4">
        <div className="flex-1 grid grid-cols-1 gap-1.5">
          {LANGUAGES.map((l) => (
            <button
              key={l.code}
              onClick={() => setFrom(l.code)}
              className="text-xs font-bold px-3 py-2 rounded-lg border-2 text-left"
              style={
                from === l.code
                  ? { background: THEME.greenSoft, color: THEME.greenDark, borderColor: THEME.green }
                  : { background: "#fff", color: THEME.ink, borderColor: THEME.line }
              }
            >
              {l.label}
            </button>
          ))}
        </div>
        <button
          onClick={swapLangs}
          className="w-9 h-9 rounded-full flex items-center justify-center shrink-0"
          style={{ background: THEME.chalk, border: `1px solid ${THEME.line}` }}
          aria-label="Swap languages"
        >
          <Icon glyph="swap" size={16} style={{ color: THEME.greenDark }} />
        </button>
        <div className="flex-1 grid grid-cols-1 gap-1.5">
          {LANGUAGES.map((l) => (
            <button
              key={l.code}
              onClick={() => setTo(l.code)}
              className="text-xs font-bold px-3 py-2 rounded-lg border-2 text-left"
              style={
                to === l.code
                  ? { background: THEME.marigoldSoft, color: "#8A6300", borderColor: THEME.marigold }
                  : { background: "#fff", color: THEME.ink, borderColor: THEME.line }
              }
            >
              {l.label}
            </button>
          ))}
        </div>
      </div>

      <textarea
        value={text}
        onChange={(e) => setText(e.target.value)}
        rows={3}
        placeholder="Type text to translate…"
        className="w-full rounded-xl p-3 text-sm mb-3 outline-none"
        style={{ border: `2px solid ${THEME.line}` }}
      />

      <button
        onClick={translate}
        disabled={!text.trim() || loading || from === to}
        className="w-full py-3 rounded-xl text-white font-semibold disabled:opacity-40 mb-2"
        style={{ background: THEME.green, fontFamily: "Fraunces, serif" }}
      >
        {loading ? "Translating…" : "Translate"}
      </button>
      {from === to && <p className="text-xs mb-3" style={{ color: THEME.coral }}>Pick two different languages.</p>}
      {error && <p className="text-sm text-center py-2" style={{ color: THEME.coral }}>{error}</p>}
      {result && (
        <div className="rounded-xl p-3" style={{ background: THEME.greenSoft }}>
          <p className="text-sm" style={{ color: THEME.ink }}>{result}</p>
        </div>
      )}
      <p className="text-xs mt-3" style={{ color: THEME.inkSoft }}>
        Machine translation can be imperfect, especially for longer sentences.
      </p>
    </Sheet>
  );
}

// Dictionary — English word lookups, slide-up sheet
// Biology/botany terms check the local glossary first (works offline, and
// includes Tamil/Hindi); anything not found there falls back to the live
// English dictionary API, so results are never thin.
// ---------------------------------------------------------------------------
function DictionarySheet({ onClose }) {
  const [word, setWord] = useState("");
  const [result, setResult] = useState(null); // { type: "botany" | "general", ... }
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const fetchGeneral = async (q) => {
    const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(q)}`);
    if (res.status === 404) return null;
    if (!res.ok) throw new Error(`Request failed (${res.status})`);
    const data = await res.json();
    const entry = data[0];
    const meanings = (entry?.meanings || []).slice(0, 3).map((m) => ({
      partOfSpeech: m.partOfSpeech,
      definitions: (m.definitions || []).slice(0, 2).map((d) => d.definition),
    }));
    return { type: "general", word: entry?.word || q, phonetic: entry?.phonetic, meanings };
  };

  const lookup = async () => {
    const q = word.trim();
    if (!q) return;
    setLoading(true);
    setError("");
    setResult(null);
    try {
      const ql = q.toLowerCase();
      const botanyHit = BOTANY_DICTIONARY.find((d) => d.term.toLowerCase() === ql);
      const botanyPartial = !botanyHit ? BOTANY_DICTIONARY.filter((d) => d.term.toLowerCase().includes(ql)) : [];

      if (botanyHit) {
        setResult({ type: "botany", hits: [botanyHit] });
      } else if (botanyPartial.length > 0) {
        setResult({ type: "botany", hits: botanyPartial.slice(0, 6) });
      } else {
        const general = await fetchGeneral(q);
        if (general) setResult(general);
        else setError(`No definition found for "${q}". Check the spelling and try again.`);
      }
    } catch (e) {
      console.error("Dictionary lookup failed:", e);
      setError("Couldn't look that up — check your internet connection and try again.");
    } finally {
      setLoading(false);
    }
  };

  return (
    <Sheet onClose={onClose} title="Dictionary">
      <p className="text-xs mb-3" style={{ color: THEME.inkSoft }}>
        Checks the biology/botany glossary first (offline, with Tamil &amp; Hindi), then the general English
        dictionary if needed.
      </p>
      <div className="flex gap-2 mb-4">
        <input
          value={word}
          onChange={(e) => setWord(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && lookup()}
          placeholder="e.g. photosynthesis"
          className="flex-1 rounded-xl p-3 text-sm outline-none"
          style={{ border: `2px solid ${THEME.line}` }}
        />
        <button
          onClick={lookup}
          disabled={!word.trim() || loading}
          className="w-12 h-12 rounded-xl text-white flex items-center justify-center shrink-0 disabled:opacity-40"
          style={{ background: THEME.green }}
        >
          <Icon glyph="search" size={18} />
        </button>
      </div>

      {loading && <p className="text-sm text-center py-6" style={{ color: THEME.inkSoft }}>Looking it up…</p>}
      {error && <p className="text-sm text-center py-4" style={{ color: THEME.coral }}>{error}</p>}

      {!loading && !error && !result && (
        <div className="text-center py-6">
          <Icon glyph="book" size={26} style={{ color: THEME.greenDark }} />
          <p className="text-sm mt-2" style={{ color: THEME.inkSoft }}>
            Search any word — biology/botany terms include Tamil &amp; Hindi translations.
          </p>
        </div>
      )}

      {result?.type === "botany" && (
        <div className="space-y-3" style={{ maxHeight: "55vh", overflowY: "auto" }}>
          {result.hits.map((h) => (
            <div key={h.term} className="rounded-xl p-3" style={{ background: THEME.chalk, border: `1px solid ${THEME.line}` }}>
              <div className="text-base font-semibold" style={{ fontFamily: "Fraunces, serif", color: THEME.ink }}>{h.term}</div>
              <div className="mt-1 text-sm" style={{ color: THEME.inkSoft }}>{h.definition}</div>
              <div className="mt-1.5 text-xs flex gap-3" style={{ color: THEME.greenDark, fontFamily: "'JetBrains Mono', monospace" }}>
                <span>தமிழ்: {h.ta || "—"}</span>
                <span>हिंदी: {h.hi || "—"}</span>
              </div>
            </div>
          ))}
        </div>
      )}

      {result?.type === "general" && (
        <div style={{ maxHeight: "55vh", overflowY: "auto" }}>
          <div className="flex items-baseline gap-2 mb-2">
            <p className="text-lg font-semibold" style={{ fontFamily: "Fraunces, serif", color: THEME.ink }}>{result.word}</p>
            {result.phonetic && <p className="text-sm" style={{ color: THEME.inkSoft }}>{result.phonetic}</p>}
          </div>
          {result.meanings.map((m, mi) => (
            <div key={mi} className="mb-3">
              <span className="text-xs font-bold px-2 py-1 rounded-full" style={{ background: THEME.greenSoft, color: THEME.greenDark }}>
                {m.partOfSpeech}
              </span>
              <ul className="mt-2 space-y-1.5">
                {m.definitions.map((d, di) => (
                  <li key={di} className="text-sm" style={{ color: THEME.ink }}>
                    <span style={{ color: THEME.inkSoft }}>{di + 1}.</span> {d}
                  </li>
                ))}
              </ul>
            </div>
          ))}
        </div>
      )}
    </Sheet>
  );
}

const SENSITIVE_HINT_KEYWORDS = ["aadhaar", "phone", "email", "address", "religion", "father", "mother"];

function detectAcademicYear(fileName) {
  const m = String(fileName || "").match(/(20\d{2})\s*[-_/]\s*(\d{2,4})/);
  if (!m) return "";
  let end = m[2];
  if (end.length === 4) end = end.slice(2);
  return `${m[1]}-${end}`;
}

function findHeaderKey(headers, exactList, substrList = [], excludeList = []) {
  const norm = (h) => h.trim().toLowerCase();
  for (const h of headers) {
    if (exactList.includes(norm(h))) return h;
  }
  for (const h of headers) {
    const hh = norm(h);
    if (excludeList.some((ex) => hh.includes(ex))) continue;
    if (substrList.some((s) => hh.includes(s))) return h;
  }
  return null;
}

// Parses every column present in the sheet (not a fixed set), tags each row
// with metadata used for filtering (_year from the filename, _name/_class/_section
// detected from headers), and preserves original column order for display.
function parseSheetRows(sheet, fileName) {
  const raw = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
  if (!raw.length) return [];
  const headerRow = raw[0].map((h) => String(h ?? "").trim());
  const colIdxs = headerRow.map((h, i) => ({ h, i })).filter((c) => c.h);
  const columns = colIdxs.map((c) => c.h);

  const nameKey = findHeaderKey(
    columns,
    ["name", "student name"],
    ["name"],
    ["tamil", "father", "mother", "bank", "branch", "account"]
  );
  const classKey = findHeaderKey(columns, ["class", "std", "standard"], ["class", "standard"]);
  const sectionKey = findHeaderKey(columns, ["section", "sec"], ["section"]);
  const year = detectAcademicYear(fileName);

  return raw
    .slice(1)
    .filter((r) => r.some((c) => String(c ?? "").trim() !== ""))
    .map((r, idx) => {
      const obj = {};
      colIdxs.forEach(({ h, i }) => {
        obj[h] = String(r[i] ?? "").trim();
      });
      return {
        ...obj,
        _id: `${year}|${idx}|${nameKey ? obj[nameKey] : idx}`,
        _year: year || "Unspecified",
        _name: nameKey ? obj[nameKey] : "",
        _class: classKey ? obj[classKey] : "",
        _section: sectionKey ? obj[sectionKey] : "",
      };
    })
    .filter((r) => r._name);
}

// Original column names in first-seen order, ignoring our internal _fields.
function rowColumns(rows) {
  const seen = [];
  const set = new Set();
  for (const r of rows) {
    for (const k of Object.keys(r)) {
      if (k.startsWith("_")) continue;
      if (!set.has(k)) {
        set.add(k);
        seen.push(k);
      }
    }
  }
  return seen;
}

function StudentsTab({ students, setStudents, ready }) {
  const fileRef = useRef(null);
  const [importing, setImporting] = useState(false);
  const [importError, setImportError] = useState(null);
  const [fileName, setFileName] = useState(null);

  const [year, setYear] = useState("");
  const [className, setClassName] = useState("");
  const [section, setSection] = useState("");
  const [nameQuery, setNameQuery] = useState("");
  const [selected, setSelected] = useState(null);
  const [page, setPage] = useState(1);
  const [pageSize, setPageSize] = useState(10);

  const years = useMemo(
    () => [...new Set(students.map((s) => s._year).filter(Boolean))].sort().reverse(),
    [students]
  );
  const classes = useMemo(
    () =>
      [...new Set(students.filter((s) => !year || s._year === year).map((s) => s._class).filter(Boolean))].sort(),
    [students, year]
  );
  const sections = useMemo(
    () =>
      [...new Set(
        students
          .filter((s) => (!year || s._year === year) && (!className || s._class === className))
          .map((s) => s._section)
          .filter(Boolean)
      )].sort(),
    [students, year, className]
  );

  const scoped = useMemo(
    () =>
      students.filter(
        (s) =>
          (!year || s._year === year) &&
          (!className || s._class === className) &&
          (!section || s._section === section)
      ),
    [students, year, className, section]
  );

  const matches = useMemo(() => {
    if (!nameQuery.trim()) return [];
    const q = nameQuery.trim().toLowerCase();
    return scoped.filter((s) => s._name.toLowerCase().includes(q)).slice(0, 8);
  }, [scoped, nameQuery]);

  const columns = useMemo(() => rowColumns(scoped), [scoped]);
  const totalPages = Math.max(1, Math.ceil(scoped.length / pageSize));
  const pageRows = useMemo(
    () => scoped.slice((page - 1) * pageSize, page * pageSize),
    [scoped, page, pageSize]
  );

  useEffect(() => {
    setPage(1);
  }, [year, className, section, pageSize, students]);

  const handleFile = async (file) => {
    if (!file) return;
    setImportError(null);
    setImporting(true);
    setFileName(file.name);
    try {
      const buffer = await file.arrayBuffer();
      const bytes = new Uint8Array(buffer);
      const wb = XLSX.read(bytes, { type: "array" });
      if (!wb.SheetNames || wb.SheetNames.length === 0) {
        throw new Error("No sheets found in this file.");
      }
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = parseSheetRows(sheet, file.name);
      if (rows.length === 0) {
        setImportError(
          "No student rows found. Make sure there's a header row with a student name column (e.g. 'Name' or 'Student Name')."
        );
      } else {
        const importedYear = rows[0]._year;
        const others = students.filter((s) => s._year !== importedYear);
        await setStudents([...others, ...rows]);
        setYear(importedYear === "Unspecified" ? "" : importedYear);
        setClassName("");
        setSection("");
      }
    } catch (e) {
      console.error("Excel import failed:", e);
      setImportError(
        `Could not read that file (${e?.message || "unknown error"}). Please upload a valid .xlsx, .xls or .csv file.`
      );
    } finally {
      setImporting(false);
    }
  };

  return (
    <div>
      {/* Import */}
      <div className="rounded-sm p-4 sm:p-5" style={{ background: THEME.paper, border: `1px solid ${THEME.paperDark}` }}>
        <h2 className="text-sm font-semibold uppercase tracking-wide" style={{ color: THEME.inkSoft, letterSpacing: "0.1em" }}>
          Import Student List
        </h2>
        <p className="text-xs mt-1" style={{ color: THEME.inkSoft }}>
          Every column in the sheet is imported as-is. Academic year is read from the file name (e.g.
          "…2025-26…" or "…2026_2027…") — name the file accordingly before uploading.
        </p>
        <div className="mt-3 flex flex-col sm:flex-row items-start sm:items-center gap-3">
          <button
            onClick={() => fileRef.current?.click()}
            className="flex items-center gap-2 text-sm px-4 py-2 rounded-sm text-white"
            style={{ background: THEME.boardGreen }}
          >
            <Icon glyph="upload" size={15} />
            {importing ? "Reading…" : "Choose Excel file"}
          </button>
          <input
            ref={fileRef}
            type="file"
            accept=".xlsx,.xls,.csv"
            className="hidden"
            onChange={(e) => {
              const file = e.target.files?.[0];
              handleFile(file);
              e.target.value = "";
            }}
          />
          {fileName && (
            <span className="text-xs" style={{ color: THEME.moss, fontFamily: "'JetBrains Mono', monospace" }}>
              {fileName}
            </span>
          )}
        </div>
        {importError && (
          <div className="mt-3 text-xs px-3 py-2 rounded-sm" style={{ background: "#F6E4DD", color: THEME.coral }}>
            {importError}
          </div>
        )}
        {ready && students.length > 0 && (
          <div className="mt-3 text-xs" style={{ color: THEME.inkSoft }}>
            {students.length} students on record across {years.length} academic year{years.length === 1 ? "" : "s"}.
            Re-uploading a file replaces only that year's data.
          </div>
        )}
        {columns.some((c) => SENSITIVE_HINT_KEYWORDS.some((k) => c.toLowerCase().includes(k))) && (
          <div className="mt-3 text-xs px-3 py-2 rounded-sm" style={{ background: THEME.marigoldSoft, color: THEME.ink }}>
            This list includes sensitive personal details (Aadhaar, contact, address, family info). Keep this
            device secure and avoid hosting this data publicly.
          </div>
        )}
      </div>

      <LeafDivider />

      {/* Filters */}
      <div className="rounded-sm p-4 sm:p-5" style={{ background: THEME.paper, border: `1px solid ${THEME.paperDark}` }}>
        <h2 className="text-sm font-semibold uppercase tracking-wide" style={{ color: THEME.inkSoft, letterSpacing: "0.1em" }}>
          Find Students
        </h2>

        <div className="mt-3 grid grid-cols-1 sm:grid-cols-4 gap-2">
          <select
            value={year}
            onChange={(e) => {
              setYear(e.target.value);
              setClassName("");
              setSection("");
              setSelected(null);
            }}
            className="px-3 py-2 text-sm rounded-sm outline-none"
            style={{ border: `1px solid ${THEME.paperDark}`, background: THEME.chalk }}
          >
            <option value="">Academic year — all</option>
            {years.map((y) => (
              <option key={y} value={y}>{y}</option>
            ))}
          </select>

          <select
            value={className}
            onChange={(e) => {
              setClassName(e.target.value);
              setSection("");
              setSelected(null);
            }}
            className="px-3 py-2 text-sm rounded-sm outline-none"
            style={{ border: `1px solid ${THEME.paperDark}`, background: THEME.chalk }}
          >
            <option value="">Class — all</option>
            {classes.map((c) => (
              <option key={c} value={c}>{c}</option>
            ))}
          </select>

          <select
            value={section}
            onChange={(e) => {
              setSection(e.target.value);
              setSelected(null);
            }}
            className="px-3 py-2 text-sm rounded-sm outline-none"
            style={{ border: `1px solid ${THEME.paperDark}`, background: THEME.chalk }}
          >
            <option value="">Section — all</option>
            {sections.map((s) => (
              <option key={s} value={s}>{s}</option>
            ))}
          </select>

          <div className="relative">
            <Icon glyph="search" size={14} className="absolute left-3 top-1/2 -translate-y-1/2" style={{ color: THEME.inkSoft }} />
            <input
              value={nameQuery}
              onChange={(e) => {
                setNameQuery(e.target.value);
                setSelected(null);
              }}
              placeholder="Student name…"
              className="w-full pl-8 pr-3 py-2 text-sm rounded-sm outline-none"
              style={{ border: `1px solid ${THEME.paperDark}`, background: THEME.chalk }}
            />
          </div>
        </div>

        {nameQuery && !selected && (
          <div className="mt-2 rounded-sm overflow-hidden" style={{ border: `1px solid ${THEME.paperDark}` }}>
            {matches.length === 0 ? (
              <div className="text-sm px-3 py-2" style={{ color: THEME.inkSoft, background: THEME.chalk }}>
                No matching students in this scope.
              </div>
            ) : (
              matches.map((s, i) => (
                <button
                  key={s._id}
                  onClick={() => setSelected(s)}
                  className="w-full text-left px-3 py-2 text-sm flex justify-between"
                  style={{ background: THEME.chalk, borderTop: i ? `1px solid ${THEME.paperDark}` : "none" }}
                >
                  <span>{s._name}</span>
                  <span style={{ color: THEME.inkSoft, fontFamily: "'JetBrains Mono', monospace" }}>
                    {s._class}{s._section ? `-${s._section}` : ""}
                  </span>
                </button>
              ))
            )}
          </div>
        )}

        {selected ? (
          <div
            className="mt-4 rounded-sm p-4"
            style={{ background: THEME.chalk, borderTop: `3px solid ${THEME.marigold}`, border: `1px solid ${THEME.paperDark}` }}
          >
            <div className="flex items-center justify-between">
              <div className="text-xs uppercase tracking-widest" style={{ color: THEME.inkSoft, letterSpacing: "0.12em" }}>
                Specimen Record
              </div>
              <button onClick={() => setSelected(null)} aria-label="Close">
                <Icon glyph="x" size={14} style={{ color: THEME.inkSoft }} />
              </button>
            </div>
            <div className="mt-1 text-xl" style={{ fontFamily: "Fraunces, serif", fontWeight: 600 }}>
              {selected._name}
            </div>
            <div className="mt-2 grid grid-cols-2 gap-y-1 text-sm" style={{ color: THEME.inkSoft }}>
              {rowColumns([selected])
                .filter((k) => selected[k])
                .map((k) => (
                  <React.Fragment key={k}>
                    <div>{k}</div>
                    <div>{selected[k]}</div>
                  </React.Fragment>
                ))}
            </div>
          </div>
        ) : (
          !nameQuery && (
            <div className="mt-4">
              <div className="flex items-center justify-between mb-2">
                <div className="text-xs" style={{ color: THEME.inkSoft }}>
                  {scoped.length} student{scoped.length === 1 ? "" : "s"} in this scope
                </div>
                <div className="flex items-center gap-1.5 text-xs" style={{ color: THEME.inkSoft }}>
                  Rows per page
                  <select
                    value={pageSize}
                    onChange={(e) => setPageSize(Number(e.target.value))}
                    className="px-2 py-1 text-xs rounded-sm outline-none"
                    style={{ border: `1px solid ${THEME.paperDark}`, background: THEME.chalk }}
                  >
                    {PAGE_SIZE_OPTIONS.map((n) => (
                      <option key={n} value={n}>{n}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div className="overflow-x-auto rounded-sm" style={{ border: `1px solid ${THEME.paperDark}` }}>
                <table className="text-xs border-collapse" style={{ minWidth: Math.max(480, columns.length * 130) }}>
                  <thead>
                    <tr>
                      {columns.map((c) => (
                        <th
                          key={c}
                          className="text-left px-2 py-2 whitespace-nowrap"
                          style={{ background: THEME.boardGreen, color: THEME.chalk }}
                        >
                          {c}
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {pageRows.map((s, i) => (
                      <tr
                        key={s._id}
                        onClick={() => setSelected(s)}
                        className="cursor-pointer"
                        style={{ background: i % 2 ? THEME.paper : THEME.chalk }}
                      >
                        {columns.map((c) => (
                          <td key={c} className="px-2 py-1.5 whitespace-nowrap" style={{ borderTop: `1px solid ${THEME.paperDark}` }}>
                            {s[c] || "—"}
                          </td>
                        ))}
                      </tr>
                    ))}
                    {pageRows.length === 0 && (
                      <tr>
                        <td className="px-2 py-3 text-center" colSpan={columns.length || 1} style={{ color: THEME.inkSoft }}>
                          No students to show.
                        </td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>

              {scoped.length > 0 && (
                <div className="flex items-center justify-between mt-2 text-xs" style={{ color: THEME.inkSoft }}>
                  <span>
                    Page {page} of {totalPages}
                  </span>
                  <div className="flex gap-2">
                    <button
                      onClick={() => setPage((p) => Math.max(1, p - 1))}
                      disabled={page <= 1}
                      className="px-3 py-1 rounded-sm"
                      style={{ border: `1px solid ${THEME.paperDark}`, opacity: page <= 1 ? 0.5 : 1 }}
                    >
                      Prev
                    </button>
                    <button
                      onClick={() => setPage((p) => Math.min(totalPages, p + 1))}
                      disabled={page >= totalPages}
                      className="px-3 py-1 rounded-sm"
                      style={{ border: `1px solid ${THEME.paperDark}`, opacity: page >= totalPages ? 0.5 : 1 }}
                    >
                      Next
                    </button>
                  </div>
                </div>
              )}
            </div>
          )
        )}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Timetable — editable weekly grid, persisted
// ---------------------------------------------------------------------------
function TimetableTab({ timetable, setTimetable, ready }) {
  const [editingKey, setEditingKey] = useState(null);
  const [draft, setDraft] = useState("");
  const [selectedDay, setSelectedDay] = useState(null); // null = full week grid

  const openCell = (dayIdx, period) => {
    const key = `${dayIdx}-${period}`;
    setEditingKey(key);
    setDraft(timetable[key] || "");
  };

  const saveCell = () => {
    if (!editingKey) return;
    const next = { ...timetable };
    if (draft.trim()) next[editingKey] = draft.trim();
    else delete next[editingKey];
    setTimetable(next);
    setEditingKey(null);
    setDraft("");
  };

  return (
    <div>
      <div className="rounded-sm p-4 sm:p-5" style={{ background: THEME.paper, border: `1px solid ${THEME.paperDark}` }}>
        <div className="flex items-center justify-between">
          <h2 className="text-sm font-semibold uppercase tracking-wide" style={{ color: THEME.inkSoft, letterSpacing: "0.1em" }}>
            Weekly Timetable
          </h2>
          <span className="text-xs" style={{ color: THEME.inkSoft }}>
            {ready ? "Tap a period to edit" : "Loading…"}
          </span>
        </div>

        {/* Day navigator — jump to any day, not just today */}
        <div className="flex gap-1.5 mt-4 overflow-x-auto pb-1">
          <button
            onClick={() => setSelectedDay(null)}
            className="px-3 py-1.5 text-xs rounded-sm whitespace-nowrap"
            style={{
              background: selectedDay === null ? THEME.boardGreen : THEME.chalk,
              color: selectedDay === null ? THEME.chalk : THEME.inkSoft,
              border: `1px solid ${selectedDay === null ? THEME.boardGreen : THEME.paperDark}`,
              fontWeight: selectedDay === null ? 600 : 500,
            }}
          >
            Full Week
          </button>
          {DAYS.map((d, i) => {
            const active = selectedDay === i;
            const isToday = i === TODAY_INDEX;
            return (
              <button
                key={d}
                onClick={() => setSelectedDay(i)}
                className="px-3 py-1.5 text-xs rounded-sm whitespace-nowrap"
                style={{
                  background: active ? THEME.marigold : THEME.chalk,
                  color: active ? THEME.chalk : THEME.inkSoft,
                  border: `1px solid ${active ? THEME.marigold : isToday ? THEME.moss : THEME.paperDark}`,
                  fontWeight: active || isToday ? 600 : 500,
                }}
              >
                {d}{isToday ? " •" : ""}
              </button>
            );
          })}
        </div>

        {selectedDay === null ? (
          <div className="mt-4 overflow-x-auto">
            <table className="w-full text-sm border-collapse" style={{ minWidth: 560 }}>
              <thead>
                <tr>
                  <th
                    className="text-left px-2 py-2 text-xs uppercase"
                    style={{ color: THEME.chalk, background: THEME.boardGreen, letterSpacing: "0.08em" }}
                  >
                    Period
                  </th>
                  {DAYS.map((d, i) => (
                    <th
                      key={d}
                      className="px-2 py-2 text-xs uppercase cursor-pointer"
                      onClick={() => setSelectedDay(i)}
                      style={{
                        color: THEME.chalk,
                        background: i === TODAY_INDEX ? THEME.marigold : THEME.boardGreen,
                        letterSpacing: "0.08em",
                      }}
                    >
                      {d}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {PERIODS.map((p) => (
                  <tr key={p}>
                    <td
                      className="px-2 py-2 text-xs font-medium"
                      style={{ background: THEME.paperDark, color: THEME.inkSoft, fontFamily: "'JetBrains Mono', monospace" }}
                    >
                      P{p}
                    </td>
                    {DAYS.map((_, dayIdx) => {
                      const key = `${dayIdx}-${p}`;
                      const value = timetable[key];
                      const isEditing = editingKey === key;
                      return (
                        <td
                          key={key}
                          className="px-1.5 py-1.5 align-top"
                          style={{ background: THEME.chalk, border: `1px solid ${THEME.paperDark}` }}
                        >
                          {isEditing ? (
                            <div className="flex flex-col gap-1">
                              <input
                                autoFocus
                                value={draft}
                                onChange={(e) => setDraft(e.target.value)}
                                onKeyDown={(e) => e.key === "Enter" && saveCell()}
                                placeholder="e.g. 11-A Botany"
                                className="w-full px-1.5 py-1 text-xs rounded-sm outline-none"
                                style={{ border: `1px solid ${THEME.moss}` }}
                              />
                              <div className="flex gap-1">
                                <button
                                  onClick={saveCell}
                                  className="flex-1 text-xs py-1 rounded-sm text-white"
                                  style={{ background: THEME.moss }}
                                >
                                  Save
                                </button>
                                <button
                                  onClick={() => setEditingKey(null)}
                                  className="text-xs px-2 py-1 rounded-sm"
                                  style={{ border: `1px solid ${THEME.paperDark}` }}
                                >
                                  <Icon glyph="x" size={12} />
                                </button>
                              </div>
                            </div>
                          ) : (
                            <button
                              onClick={() => openCell(dayIdx, p)}
                              className="w-full text-left text-xs px-1.5 py-2 rounded-sm"
                              style={{ minHeight: "2.25rem", color: value ? THEME.ink : THEME.paperDark, background: "transparent" }}
                            >
                              {value || "+"}
                            </button>
                          )}
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        ) : (
          <div className="mt-4">
            <div className="flex items-center justify-between mb-2">
              <button
                onClick={() => setSelectedDay((d) => (d - 1 + DAYS.length) % DAYS.length)}
                className="px-3 py-1.5 text-xs rounded-sm"
                style={{ border: `1px solid ${THEME.paperDark}`, color: THEME.inkSoft }}
              >
                ← {DAYS[(selectedDay - 1 + DAYS.length) % DAYS.length]}
              </button>
              <div className="text-sm font-semibold" style={{ color: THEME.ink, fontFamily: "Fraunces, serif" }}>
                {DAYS[selectedDay]}{selectedDay === TODAY_INDEX ? " (Today)" : ""}
              </div>
              <button
                onClick={() => setSelectedDay((d) => (d + 1) % DAYS.length)}
                className="px-3 py-1.5 text-xs rounded-sm"
                style={{ border: `1px solid ${THEME.paperDark}`, color: THEME.inkSoft }}
              >
                {DAYS[(selectedDay + 1) % DAYS.length]} →
              </button>
            </div>
            <div className="rounded-sm overflow-hidden" style={{ border: `1px solid ${THEME.paperDark}` }}>
              {PERIODS.map((p, i) => {
                const key = `${selectedDay}-${p}`;
                const value = timetable[key];
                const isEditing = editingKey === key;
                return (
                  <div
                    key={p}
                    className="flex items-center gap-3 px-3 py-2.5"
                    style={{ background: i % 2 ? THEME.paper : THEME.chalk, borderTop: i ? `1px solid ${THEME.paperDark}` : "none" }}
                  >
                    <div
                      className="text-xs font-medium w-10 shrink-0"
                      style={{ color: THEME.inkSoft, fontFamily: "'JetBrains Mono', monospace" }}
                    >
                      P{p}
                    </div>
                    {isEditing ? (
                      <div className="flex-1 flex gap-2">
                        <input
                          autoFocus
                          value={draft}
                          onChange={(e) => setDraft(e.target.value)}
                          onKeyDown={(e) => e.key === "Enter" && saveCell()}
                          placeholder="e.g. 11-A Botany"
                          className="flex-1 px-2 py-1.5 text-sm rounded-sm outline-none"
                          style={{ border: `1px solid ${THEME.moss}` }}
                        />
                        <button onClick={saveCell} className="text-xs px-3 py-1.5 rounded-sm text-white" style={{ background: THEME.moss }}>
                          Save
                        </button>
                        <button
                          onClick={() => setEditingKey(null)}
                          className="text-xs px-2 py-1.5 rounded-sm"
                          style={{ border: `1px solid ${THEME.paperDark}` }}
                        >
                          <Icon glyph="x" size={12} />
                        </button>
                      </div>
                    ) : (
                      <button
                        onClick={() => openCell(selectedDay, p)}
                        className="flex-1 text-left text-sm px-2 py-1.5 rounded-sm"
                        style={{ color: value ? THEME.ink : THEME.inkSoft }}
                      >
                        {value || "+ Add class"}
                      </button>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
